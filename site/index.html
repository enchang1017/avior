<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Avior is an open-source governed SQL gateway for PostgreSQL. Every statement is guarded against its execution plan, audited before it runs, and returned read-only."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        try {
          var stored = localStorage.getItem('avior-color-mode')
          if (stored === 'dark') dark = true
          if (stored === 'light') dark = false
        } catch (e) {}
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
      })()
    </script>
    <title>Avior — a governed SQL gateway for PostgreSQL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
