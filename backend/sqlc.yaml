version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: internal/store/queries
    gen:
      go:
        package: storegen
        out: internal/store/gen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_empty_slices: true
