name: images

# The split and standalone images, published to GHCR when a release is published
# and built without pushing on every pull request that could change them.
#
# Two jobs rather than one with a conditional push: permissions cannot depend on
# the event, and a single job would hold packages: write on every pull request.
# backend/test/docs/images_test.go holds this file to that shape.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - "db/migrations/**"
      - "deploy/migrate/**"
      - "deploy/standalone/**"
      - "deploy/compose/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: avior-backend
            dockerfile: backend/Dockerfile
          - image: avior-frontend
            dockerfile: frontend/Dockerfile
          - image: avior-migrate
            dockerfile: deploy/migrate/Dockerfile
          - image: avior
            dockerfile: deploy/standalone/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: avior-backend
            dockerfile: backend/Dockerfile
          - image: avior-frontend
            dockerfile: frontend/Dockerfile
          - image: avior-migrate
            dockerfile: deploy/migrate/Dockerfile
          - image: avior
            dockerfile: deploy/standalone/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The version comes from here and nowhere else: a tag that is not strict
      # SemVer is refused before anything is built, rather than left to
      # metadata-action to skip while latest goes out anyway.
      - id: version
        name: Read the version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/release-version.sh "$TAG"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' && !github.event.release.prerelease }}
      - name: Refuse to push anything but the version and a stable latest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          STABLE: ${{ steps.version.outputs.stable == 'true' && !github.event.release.prerelease }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/check-release-tags.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # A push that reported success is not proof the registry serves the tag.
      - name: Read every pushed tag back from the registry
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"
