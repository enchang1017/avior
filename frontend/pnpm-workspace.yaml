# pnpm 10 reads its settings from here. Once this file exists the `pnpm` field in
# package.json is not read at all, so overrides live here too.

# Install scripts are blocked by default. These two are allowlisted because they
# are load-bearing: esbuild fetches its platform binary, and vue-demi selects the
# Vue version. Everything else stays blocked — add to this list deliberately,
# never by disabling the protection.
onlyBuiltDependencies:
  - esbuild
  - vue-demi

# pnpm rejects packages published within roughly the last day as a supply-chain
# measure. These pins hold the transitive eslint toolchain at versions inside
# that policy. Raise them deliberately once newer releases have aged past it.
overrides:
  '@typescript-eslint/eslint-plugin': 8.68.0
  '@typescript-eslint/parser': 8.68.0
  '@typescript-eslint/project-service': 8.68.0
  '@typescript-eslint/scope-manager': 8.68.0
  '@typescript-eslint/tsconfig-utils': 8.68.0
  '@typescript-eslint/type-utils': 8.68.0
  '@typescript-eslint/types': 8.68.0
  '@typescript-eslint/typescript-estree': 8.68.0
  '@typescript-eslint/utils': 8.68.0
  '@typescript-eslint/visitor-keys': 8.68.0
  typescript-eslint: 8.68.0
  '@codemirror/state': 6.7.1
  '@codemirror/view': 6.43.9
  '@codemirror/search': 6.7.1
  ignore: 7.0.6
