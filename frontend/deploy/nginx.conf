server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;

	# Every route the router owns is served by index.html. Without this a reload
	# on /writes/<id> asks nginx for a file that was never written and answers
	# 404, which reads as the page having been deleted.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# The build fingerprints these, so a stale one is a different filename and
	# can never be served in place of a new one.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# index.html is the one file whose name never changes, so it is the one file
	# that must not be held: a cached copy points at the previous build's assets.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# An MCP client answered 401 goes looking for OAuth metadata here, and the
	# SPA fallback above would hand it index.html with a 200 — which it then
	# tries to read as JSON, retries, and spends twenty-odd seconds on before
	# it gives up and connects. Avior has no OAuth; say so at once.
	location /.well-known/ {
		return 404;
	}

	# Where the same client, finding no metadata, tries to register itself.
	# Falling through to index.html answers a POST with 405, which reads as a
	# broken server rather than one with no OAuth.
	location = /register {
		return 404;
	}

	location = /healthz {
		access_log off;
		return 200 "ok\n";
	}
}
