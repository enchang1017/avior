openapi: 3.0.3
info:
  title: Avior API
  version: 0.1.0
  description: |
    Governed SQL gateway. Successor to the predecessor.

    This document is the single source of truth for the HTTP contract.
    Go server interfaces and the frontend TypeScript client are both generated
    from it. Never hand-edit generated code: `make verify` fails on drift.

servers:
  - url: /api/v1

tags:
  - name: system
  - name: auth
  - name: schema
  - name: query
  - name: audit
  - name: search
  - name: lineage
  - name: accounts
  - name: release
  - name: provision
  - name: observatory

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and dependency readiness
      security: []
      responses:
        "200":
          description: Service state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Identity and effective permissions of the caller
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tokens:
    get:
      tags: [auth]
      operationId: listTokens
      summary: The caller's own API tokens
      description: |
        FEAT-053. Name, created, expires, last used and revoked — never the
        value, which exists only in the response that created it. Needs a
        session: a token cannot list tokens.
      responses:
        "200":
          description: The caller's tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [auth]
      operationId: createToken
      summary: Mint an API token for the caller
      description: |
        FEAT-053. The plaintext is in this response and nowhere else: Avior
        stores a hash and cannot show it again. Needs a session — a token
        cannot mint a token.

        What the token may do is what the account may do, minus every decision
        and every administration. It can inspect, execute and submit; it cannot
        approve, grant, or manage tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreation"
      responses:
        "201":
          description: The token, with its value shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke one of the caller's tokens
      description: |
        FEAT-053. Refused from the next request on. Somebody else's token
        answers 404 rather than 403, so the set of ids cannot be probed.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked, or already was
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schema/databases:
    get:
      tags: [schema]
      operationId: listDatabases
      summary: Databases readable on an instance
      description: |
        Read live from the instance. PostgreSQL's own databases are excluded,
        and so is Avior's store: it holds session tokens, the audit trail and the
        denial policy the guard reads, and is never a governed database.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: Database names, ordered
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /schema/tables:
    get:
      tags: [schema]
      operationId: listTables
      summary: Tables and views in a database
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
      responses:
        "200":
          description: Tables and views, ordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /schema/graph:
    get:
      tags: [schema]
      operationId: getSchemaGraph
      summary: A database's tables and views, and the relationships between them
      description: |
        FEAT-067. The objects are exactly those `/schema/tables` lists, with
        partitions folded into their parent. An edge is a declared foreign key
        or a recorded view dependency, never a guess. Read live, never cached.

        A database the caller's roles do not reach is refused before its
        catalogue is read, and Avior's own store is refused by name whatever is
        granted. At most 2,000 nodes and 4,000 edges are returned, keeping the
        most connected nodes, and `truncated` says whether any were left out.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /lineage/graph:
    get:
      tags: [lineage]
      operationId: getLineageGraph
      summary: The objects around one object, and which way data moves between them
      description: |
        FEAT-070. The focus and every object within `hops` of it: tables,
        views, materialised views, functions, procedures and the sequences an
        edge reaches. An edge PostgreSQL records is `exact`; one read out of a
        routine's body is `parsed`. SQL a routine builds at run time is never
        an edge.

        Answered from a per-replica snapshot. A database whose first snapshot
        is still building answers `state: building` with no graph, and never
        waits. A database the caller's roles do not reach is refused before any
        catalogue is read or any snapshot built, and Avior's own store is
        refused by name whatever is granted. Nothing is audited.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: focus
          in: query
          required: false
          description: |
            The focus's node id. Exactly one of `focus` and the name-based
            `schema` + `name` + `kind` is given; both, or neither, is `422
            lineage.focus`.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/lineageSchema"
        - $ref: "#/components/parameters/lineageName"
        - $ref: "#/components/parameters/lineageKind"
        - $ref: "#/components/parameters/lineageSignature"
        - name: hops
          in: query
          required: false
          description: 1 or 2; 3 only with `cluster=true`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: cluster
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: expand
          in: query
          required: false
          description: A collapsed hub's node id, whose neighbours to return.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: kinds
          in: query
          required: false
          description: The node kinds to keep. Every kind when absent.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LineageNodeKind"
        - name: confidence
          in: query
          required: false
          description: The confidences to keep. Both when absent.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LineageConfidence"
        - name: extensions
          in: query
          required: false
          description: Include routines an extension owns.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The neighbourhood, or `building`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /lineage/path:
    get:
      tags: [lineage]
      operationId: getLineagePath
      summary: The shortest routes between two objects
      description: |
        FEAT-070 AC-14. At most four shortest routes, each at most `maxHops`
        long, over the edge kinds asked for. Two objects with no route answer
        an empty list. `maxHops` above 5 is `422 lineage.path_length`.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: from
          in: query
          required: false
          description: |
            The first object's node id, or give it by name with `fromSchema`,
            `fromName`, `fromKind` and, for a routine, `fromSignature`. Exactly
            one of the two forms, for each end; both, or neither, is `422
            lineage.focus`.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: fromSchema
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: fromName
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: fromKind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LineageFocusKind"
        - name: fromSignature
          in: query
          required: false
          description: A routine's identity arguments, as PostgreSQL prints them; empty for none.
          schema:
            type: string
            maxLength: 1024
        - name: to
          in: query
          required: false
          description: The second object's node id, or give it by name with the `to…` parameters.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: toSchema
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: toName
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: toKind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LineageFocusKind"
        - name: toSignature
          in: query
          required: false
          description: A routine's identity arguments, as PostgreSQL prints them; empty for none.
          schema:
            type: string
            maxLength: 1024
        - name: maxHops
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
        - name: kinds
          in: query
          required: false
          description: The edge kinds a route may use. Every kind when absent.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LineageEdgeKind"
      responses:
        "200":
          description: The routes, or `building`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineagePath"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /lineage/overview:
    get:
      tags: [lineage]
      operationId: getLineageOverview
      summary: The database at the scale of its schemas
      description: |
        FEAT-070 AC-52. Each schema is one cluster, sized by the objects it
        holds, anchored on its most connected object; every edge between two
        schemas is folded into one link. No object and no edge within a
        schema is answered. The same checks as every lineage endpoint, in the
        same order, and nothing is audited.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: extensions
          in: query
          required: false
          description: Count routines an extension owns.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The galaxy, or `building`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /lineage/column:
    get:
      tags: [lineage]
      operationId: getLineageColumn
      summary: Who writes one column, or one table, and who reads it
      description: |
        FEAT-070 AC-15, AC-16 and AC-56. Writers and readers, 50 to a page, each
        with its confidence, its statement excerpt of at most 120 characters and
        its line, and the table's read and write counts per column. Without a
        column it answers the whole table. The first page carries the impact:
        the summary, the triggers that fire and the indirect reach. A column a
        FEAT-055 restriction covers is shown and marked `restricted`; no answer
        carries a value from a governed table.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: schema
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: table
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: column
          in: query
          required: false
          description: The column. Absent, the answer is the whole table's.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: cursor
          in: query
          required: false
          description: The `next` of the previous page.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of the column's usage, or `building`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageColumn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /lineage/routine:
    get:
      tags: [lineage]
      operationId: getLineageRoutine
      summary: What one routine reads, writes, calls and builds at run time
      description: |
        FEAT-070 AC-17. Never carries the routine's body: the whole definition
        is FEAT-023's, which audits reading it.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: routine
          in: query
          required: true
          description: The routine's node id.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: The routine's footprint, or `building`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageRoutine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /schema/partitions:
    get:
      tags: [schema]
      operationId: getTablePartitions
      summary: How one table is partitioned, and what it is a partition of
      description: |
        FEAT-075. A catalogue read, like the rest of FEAT-008: no row of the
        table is read, so every count is the planner's estimate and says so.

        A partitioned table answers its strategy, its key and one entry per
        direct partition, each with its bound, its estimated rows and its size
        on disk. A partition answers the table it belongs to. An ordinary table
        answers neither, with an empty list, rather than a 404: it exists, and
        the answer to "how is it partitioned" is "it is not".

        Warnings are what an operator should act on before it hurts: a DEFAULT
        partition that holds rows, and a range whose highest bound is less
        than two months away.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: schema
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: table
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The table's partitioning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePartitioning"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /schema/columns:
    get:
      tags: [schema]
      operationId: listColumns
      summary: Columns of one table or view
      description: |
        Columns denied to the caller are returned with denied set, not omitted.
        An operator has to be able to see that a column exists and is refused;
        hiding it makes a wide table look narrow and a refusal look like a bug.

        A table or view the database does not hold is `404 schema.table_unknown`,
        never an empty list: an empty list reads as a table that exists.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: schema
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: table
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Columns in ordinal order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColumnRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/schema/tables:
    get:
      tags: [accounts]
      operationId: listAllTables
      summary: The tables of any governed database, unfiltered
      description: |
        FEAT-055. The administration has to reach a column before it can
        restrict one, and `/schema/tables` answers what the *reader's* roles
        reach — an administrator holding no database grant could not pick the
        column they were asked to restrict.

        Needs `permission.manage`, the same as the change it leads to.
      parameters:
        - $ref: "#/components/parameters/database"
      responses:
        "200":
          description: Tables and views, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/schema/columns:
    get:
      tags: [accounts]
      operationId: listAllColumns
      summary: The columns of any governed table, unfiltered
      description: |
        FEAT-055. Names only: this is a picker, and what the caller may read is
        a different question answered elsewhere. A restricted column appears
        here like any other, because restricting one twice is harmless and
        hiding it would make the list disagree with the page it feeds.
      parameters:
        - $ref: "#/components/parameters/database"
        - name: schema
          in: query
          required: true
          schema: { type: string }
        - name: table
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Column names, in the order the table declares them
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /columns/restrictions:
    get:
      tags: [accounts]
      operationId: listColumnRestrictions
      summary: Which columns are restricted, and who has been unlocked for them
      description: |
        FEAT-055. A restricted column is refused to every role — including `dba`
        and `administrator` — until an unlock names one.

        Readable by anybody signed in: knowing that a column exists and is
        restricted is what stops a refusal reading as a fault, and it is learned
        from a single refusal anyway. Changing it needs `permission.manage`.
      responses:
        "200":
          description: Every restriction, with the unlocks that apply to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /columns/history:
    get:
      tags: [accounts]
      operationId: listColumnHistory
      summary: Who restricted or unlocked a column
      description: |
        FEAT-055 AC-9. Append-only. An unlock is somebody deciding that a role
        may read something marked as careful, and a record of that is worth
        nothing if nobody can read it.

        Needs `permission.manage`, the same as making the change.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The changes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColumnChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /columns/restriction:
    put:
      tags: [accounts]
      operationId: setColumnRestriction
      summary: Mark a column restricted, or make it ordinary again
      description: |
        FEAT-055. Removing a restriction leaves the unlocks that named it where
        they are: they are inert without it, and deleting them would delete the
        record of who was given what.

        A restriction on a partition is refused with `422`
        `columns.partition`, naming the partitioned table to restrict instead.
        The guard checks a partition against the table it belongs to, so a
        restriction there covers every partition, including ones created
        later. Removing one already set on a partition is still allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [database, object, column, restricted]
              additionalProperties: false
              properties:
                database: { type: string }
                object:
                  type: string
                  description: The qualified name — `public.member`. For a partitioned table, the parent.
                column: { type: string }
                restricted: { type: boolean }
                reason: { type: string }
      responses:
        "200":
          description: The policy, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /columns/unlock:
    put:
      tags: [accounts]
      operationId: setColumnUnlock
      summary: Open a restricted column to one role, or close it again
      description: |
        FEAT-055. A reason is required, because unlocking is the exception
        somebody has to be able to justify afterwards — restricting is the
        careful default and needs no defence.

        An expiry makes the unlock stop on its own, which is what "temporary"
        has to mean if it is to mean anything. Without one it lasts until
        somebody removes it.

        Refused when the column is not restricted: there is nothing to unlock,
        and a row saying otherwise would read as a permission somebody was
        given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [database, object, column, role, unlocked]
              additionalProperties: false
              properties:
                database: { type: string }
                object: { type: string }
                column: { type: string }
                role: { type: string }
                unlocked: { type: boolean }
                reason: { type: string }
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: The policy, as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /databases/governed:
    get:
      tags: [accounts]
      operationId: listGovernedDatabases
      summary: Every governed database on the server
      description: |
        FEAT-058. Unfiltered, unlike `/schema/databases`, which answers what the
        caller's own roles reach. The page that decides who reaches what cannot
        be built from the filtered list: a database granted to nobody would be
        invisible on the very page whose job is to grant it, which is exactly
        the state a newly added service database is in.

        Needs `permission.manage`, because it names every database on the
        server. `aviorDB` is not among them; it is not governed.
      responses:
        "200":
          description: Every governed database, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /databases/grants/history:
    get:
      tags: [accounts]
      operationId: listDatabaseGrantHistory
      summary: Who opened or closed a door onto a database
      description: |
        FEAT-058 AC-7. Append-only. A grant is access to a production database,
        and a record of who gave it is worth nothing if nobody can read it —
        which was the state before this endpoint: the rows existed and no page
        showed them.

        Needs `permission.manage`, the same as changing a grant.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The changes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseGrantChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /databases/grants:
    get:
      tags: [accounts]
      operationId: listDatabaseGrants
      summary: Which roles reach which governed database
      description: |
        FEAT-058. Deny by default: a role reaches a database because a row here
        says so. Readable by anybody signed in — knowing that `payment` exists
        and that your role does not reach it is what stops a refusal reading as
        an outage. Changing it needs `permission.manage`.
      responses:
        "200":
          description: Every grant, by database then role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /databases/{database}/roles/{role}:
    put:
      tags: [accounts]
      operationId: setDatabaseGrant
      summary: Grant or revoke a role's reach into one database
      description: |
        FEAT-058. Takes effect on the operator's next request: unlike a role,
        this is read per request rather than resolved into the session, so a
        grant taken away stops working without waiting for them to sign out.

        `aviorDB` may be named here and changes nothing — the structural refusal
        runs before any grant is consulted.
      parameters:
        - name: database
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              additionalProperties: false
              properties:
                granted:
                  type: boolean
                reason:
                  type: string
                  description: Why, for the record. Kept whatever the outcome.
      responses:
        "200":
          description: The grants, as they now stand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /operators:
    get:
      tags: [accounts]
      operationId: listOperators
      summary: Every operator and the roles they hold
      description: |
        FEAT-004. Needs `account.manage`.
      responses:
        "200":
          description: The operators, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /roles:
    get:
      tags: [accounts]
      operationId: listRoles
      summary: Every role and what holding it opens
      description: |
        FEAT-004. The role model, written for the person deciding who gets what.

        An administrator granting a role is deciding what somebody may do
        against a production database, and the role names alone do not say. The
        permissions come from the domain's own table rather than from a list
        beside it, so a role cannot go on being described by what it used to
        open.

        Needs only a session: this describes the product's roles, not anybody's
        access.
      responses:
        "200":
          description: Every role, least reach first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /operators/{operatorId}/roles/{role}:
    put:
      tags: [accounts]
      operationId: setOperatorRole
      summary: Grant or revoke one role
      description: |
        Two rules, both recovered from the predecessor and both about the role rather
        than about the caller's permission.

        `administrator` is never granted or revoked here, by anybody. The check
        is on the role being changed, which is what stops this endpoint from
        being a way to become one — an administrator is provisioned outside the
        application. Every other role is grantable by anybody holding
        `account.manage`.

        Granting a role somebody already holds changes nothing and is not an
        error: a page that refused would make a double click into a failure.
      parameters:
        - $ref: "#/components/parameters/operatorId"
        - name: role
          in: path
          required: true
          description: |
            `developer`, `dba`, `release_approver` or `update_approver`.
            Deliberately not an enum:
            which roles may be changed here is a rule of FEAT-004, not of the
            transport, and the answers differ. `administrator` is refused with
            `403` naming the role, and a role this build does not recognise with
            `422`. An enum would make both a `400` from the validator and lose
            the distinction.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              additionalProperties: false
              properties:
                granted:
                  type: boolean
      responses:
        "200":
          description: The operator, as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /operators/{operatorId}/disabled:
    put:
      tags: [accounts]
      operationId: setOperatorDisabled
      summary: Switch an account off, or back on
      description: |
        The roles are left alone. A suspension that dropped them would be a
        re-provisioning to undo.

        An administrator cannot switch off their own account. Another
        administrator still can, which is the difference between a safeguard and
        a lockout.
      parameters:
        - $ref: "#/components/parameters/operatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              additionalProperties: false
              properties:
                disabled:
                  type: boolean
      responses:
        "200":
          description: The operator, as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /service-accounts:
    get:
      tags: [accounts]
      operationId: listServiceAccounts
      summary: Every service account, its roles and its tokens
      description: |
        FEAT-063. Name, description, whether it is switched on, who created
        it, the roles it holds, and every token it has held — never a value.
        Needs `account.manage` and a session.
      responses:
        "200":
          description: The service accounts, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [accounts]
      operationId: createServiceAccount
      summary: Create an account for an agent that is nobody's person
      description: |
        FEAT-063. The name carries the `svc-` prefix and is unique among every
        account, compared without regard to case. The account starts with no
        role, has no password and can never sign in; its roles are granted on
        the account page like anybody's, and it reads through tokens minted
        below. Needs `account.manage` and a session.

        A name without the prefix, one already taken, or a blank description
        answers `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAccountCreation"
      responses:
        "201":
          description: The account, holding nothing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /service-accounts/{operatorId}/tokens:
    post:
      tags: [accounts]
      operationId: createServiceAccountToken
      summary: Mint a token for a service account
      description: |
        FEAT-063. The plaintext is in this response and nowhere else. The token
        reads as the service account and does exactly what any FEAT-053 token
        may. Needs `account.manage` and a session: no token, the service
        account's own included, can mint one.

        A service account holds at most two live tokens, so one can be replaced
        without downtime. A third answers `409`, naming the two that are live.
      parameters:
        - $ref: "#/components/parameters/operatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreation"
      responses:
        "201":
          description: The token, with its value shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The service account already holds every live token it may
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /service-accounts/{operatorId}/tokens/{tokenId}:
    delete:
      tags: [accounts]
      operationId: revokeServiceAccountToken
      summary: Revoke one of a service account's tokens
      description: |
        FEAT-063. Refused from the next request on. Needs `account.manage` and
        a session.
      parameters:
        - $ref: "#/components/parameters/operatorId"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /objects:
    get:
      tags: [objects]
      operationId: listObjects
      summary: Objects of one type in a database
      description: |
        The five types the predecessor offers, and only those. For `index` the list is
        the relations that can carry one — tables, partitioned tables and
        materialised views — because an index is read through the relation that
        holds it, which is why the predecessor labels that menu "Table".
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - $ref: "#/components/parameters/objectType"
      responses:
        "200":
          description: Objects of that type, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /objects/definition:
    get:
      tags: [objects]
      operationId: getObjectDefinition
      summary: The definition of one object, as script
      description: |
        Read-only. Nothing here executes what it returns.

        An object that does not exist is a 404 naming it. The predecessor answers an
        empty string, which an operator cannot tell apart from an object whose
        body is empty.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - $ref: "#/components/parameters/objectType"
        - name: schema
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /objects/table:
    get:
      tags: [objects]
      operationId: getTableStructure
      summary: One table as its columns, indexes, grants and comment
      description: |
        FEAT-054. A document rather than a script, because a table is not one
        thing: its columns, its indexes, its grants and its comment are four
        independent facts, and a CREATE TABLE rendering them as one block would
        hide four answers behind a script nobody runs.

        The index and grant statements are the ones the definition viewer
        renders, from the same code — a table's indexes must not read
        differently depending on which tab was opened.

        Views are accepted. A view has columns, grants and a comment, and no
        indexes; it says so rather than being refused.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/database"
        - name: schema
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The table, in sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableStructure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /query/template:
    post:
      tags: [query]
      operationId: buildSelectTemplate
      summary: Build a SELECT over the named columns
      description: |
        Returns a statement the guard will accept, so an operator never has to
        remember the rules. It always names the columns explicitly rather than
        selecting a wildcard, and bounds the result, because both are
        requirements the guard enforces. Generating them here is what stops a
        correct request being refused for a reason the operator did not choose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectTemplateRequest"
      responses:
        "200":
          description: Generated statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /query/inspect:
    post:
      tags: [query]
      operationId: inspectQuery
      summary: Run the guard pipeline without executing the statement
      description: |
        Parses the statement, resolves referenced tables and columns, checks
        column permissions, and estimates cost. Returns the verdict the gateway
        would apply. Never touches user data.
      parameters:
        - $ref: "#/components/parameters/RequestedBy"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Guard verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardVerdict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: |
            The governed server refused to plan the statement. Inspecting runs
            it through EXPLAIN on the target, so a grant on the database can
            refuse it before Avior has a verdict to report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /query/execute:
    post:
      tags: [query]
      operationId: executeQuery
      summary: Execute a read-only statement through the guard pipeline
      description: |
        Applies the full guard pipeline, then executes against the target
        instance. Every call is written to the audit log before the statement
        reaches the database, whatever the verdict.
      parameters:
        - $ref: "#/components/parameters/RequestedBy"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Result set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Guard rejected the statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardVerdict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: |
            The governed server refused the read, which is a grant on the
            database rather than a denial in Avior's policy. The two are
            deliberately different answers: a 403 is changed here, a 502 is
            changed by whoever owns the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Statement exceeded its timeout budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit/mine:
    get:
      tags: [audit]
      operationId: listOwnAuditEntries
      summary: The caller's own submissions
      description: |
        Every submission the caller made, newest first: probes and executions,
        allowed and denied alike. Scoped to the caller by the session and by
        nothing the caller sends, so no parameter widens it.

        The predecessor filters its personal log to query submissions alone, which hides
        an operator's own update and export history from them. FEAT-003 AC-2.
      parameters:
        - $ref: "#/components/parameters/auditFrom"
        - $ref: "#/components/parameters/auditTo"
        - $ref: "#/components/parameters/auditLimit"
        - $ref: "#/components/parameters/auditOffset"
      responses:
        "200":
          description: A page of the caller's submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: Every operator's submissions
      description: |
        The administrator's view. Requires `audit.read.all`; holding
        `audit.read.own` alone is a 403, so a developer cannot read a
        colleague's log by addressing this endpoint instead.

        The operator and statement filters are substring matches, as the predecessor
        has them. The predecessor implements both in its stored procedure and binds
        neither, so neither works there. FEAT-003 AC-6.
      parameters:
        - $ref: "#/components/parameters/auditOperator"
        - $ref: "#/components/parameters/auditStatement"
        - $ref: "#/components/parameters/auditDecision"
        - $ref: "#/components/parameters/auditFrom"
        - $ref: "#/components/parameters/auditTo"
        - $ref: "#/components/parameters/auditLimit"
        - $ref: "#/components/parameters/auditOffset"
      responses:
        "200":
          description: A page of submissions across every operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /audit/mine/histogram:
    get:
      tags: [audit]
      operationId: getOwnAuditHistogram
      summary: The caller's own submissions, counted per hour
      description: |
        FEAT-069. Counts exactly what `/audit/mine` lists, scoped to the caller
        by the session and by nothing the caller sends.

        The window is half-open, `[from, to)`. With neither bound it is the 168
        hours ending at the end of the current UTC hour, and with one bound the
        other is 168 hours away from it. Every hour in the window has a bucket,
        zeros included, aligned to the hour in UTC.
      parameters:
        - $ref: "#/components/parameters/histogramFrom"
        - $ref: "#/components/parameters/histogramTo"
      responses:
        "200":
          description: Hourly buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditHistogram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /audit/histogram:
    get:
      tags: [audit]
      operationId: getAuditHistogram
      summary: Every operator's submissions, counted per hour
      description: |
        FEAT-069. Requires `audit.read.all`, as `/audit` does, and takes its
        filters with the same meaning. For any filter and window the buckets
        add up to the entries `/audit` lists, where `/audit`'s inclusive `to` is
        this window's end less one microsecond.
      parameters:
        - $ref: "#/components/parameters/auditOperator"
        - $ref: "#/components/parameters/auditStatement"
        - $ref: "#/components/parameters/auditDecision"
        - $ref: "#/components/parameters/histogramFrom"
        - $ref: "#/components/parameters/histogramTo"
      responses:
        "200":
          description: Hourly buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditHistogram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /observatory/usage:
    get:
      tags: [observatory]
      operationId: getObservatoryUsage
      summary: Submissions through Avior, per operator and database
      description: |
        FEAT-071 phase 1, read from `audit_entry` only. With `audit.read.all`
        every operator's rows; with `audit.read.own` alone only the caller's,
        and naming another operator is a 403. Databases the caller's roles do
        not reach (FEAT-058) contribute nothing. Elapsed and rows are over
        executed statements only, counted in `executed`.

        The window is `[from, to)`. With neither bound it is the 7 days ending
        at the close of the current UTC hour, so a statement stamped a moment
        ahead by the database's clock is inside it; it may not exceed 90 days.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: database
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: operatorId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One row per operator and database with any submission in the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /observatory/usage/series:
    get:
      tags: [observatory]
      operationId: getObservatoryUsageSeries
      summary: Submissions through Avior over time, with totals against the previous period
      description: |
        FEAT-072. Scoped as `/observatory/usage`: everyone's with
        `audit.read.all`, the caller's own with `audit.read.own` alone, nothing
        from a database the caller does not reach.

        The window is `[from, to)`, default the 7 days ending at the end of
        the current six-hour UTC bucket, at most 90 days. Buckets are hourly
        for windows up to 2 days, six-hourly up to 14 days and daily beyond,
        aligned to UTC, every one present. p50
        and p95 are over executed statements and null when there were none.
        `previous` covers the window of the same length that ends at `from`.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: database
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
      responses:
        "200":
          description: The buckets and the totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryUsageSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /observatory/summary:
    get:
      tags: [observatory]
      operationId: getObservatorySummary
      summary: The largest tables and the idle counts across the reachable databases
      description: |
        FEAT-072, answered from the snapshots in aviordb. Requires
        `instance.read` or `audit.read.all`. Databases the caller's roles do
        not reach are absent; a `database` filter naming one is a 403.
      parameters:
        - name: database
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatorySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /observatory/routines:
    get:
      tags: [observatory]
      operationId: getObservatoryRoutines
      summary: How fast each function and procedure runs over a window
      description: |
        FEAT-073, answered from the snapshots in aviordb. Every signed-in
        operator; databases the caller's roles do not reach are absent, and a
        `database` filter naming one is a 403.

        Calls, total and self time are summed over the snapshot intervals in
        the window; mean per call is total over calls. `maxCallMs` is the
        longest top-level call `pg_stat_statements` recorded for a statement
        that is exactly one call of the routine, since `statsSince`; null when
        no such statement exists. There is no threshold and no flag.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
        - name: database
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: search
          in: query
          required: false
          description: A substring of schema.name, case-insensitive.
          schema: { type: string, maxLength: 128 }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [mean, total, self, calls, slowest]
            default: mean
        - name: order
          in: query
          required: false
          description: |
            Largest first (`desc`) or smallest first (`asc`). A missing figure,
            the mean of an uncalled routine or a slowest call nobody recorded,
            is last in both.
          schema:
            type: string
            enum: [desc, asc]
            default: desc
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: The routines, in the order asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryRoutines"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /observatory/databases:
    get:
      tags: [observatory]
      operationId: getObservatoryDatabases
      summary: Each reachable database's size, growth and flagged count
      description: |
        FEAT-071 phase 2, answered from the snapshots in aviordb. Requires
        `instance.read` or `audit.read.all`. Databases the caller's roles do
        not reach are absent.
      responses:
        "200":
          description: The databases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryDatabases"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /observatory/objects:
    get:
      tags: [observatory]
      operationId: getObservatoryObjects
      summary: When each table, index, function and procedure was last used
      description: |
        FEAT-071 phase 2. Requires `instance.read` or `audit.read.all`, and a
        database the caller reaches (403 otherwise, as for one that does not
        exist). Every object carries its last use as data and a flag when that
        is more than `idleDays` ago. Date-versioned routines are also returned
        grouped by base name. Columns are not returned: PostgreSQL keeps no
        per-column usage statistics.
      parameters:
        - name: database
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 63 }
      responses:
        "200":
          description: The objects and the routine groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryObjects"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /observatory/health:
    get:
      tags: [observatory]
      operationId: getObservatoryHealth
      summary: Dead tuples, sequential scans and vacuum times per table
      description: |
        FEAT-071 phase 3, read live from the database's statistics. Requires
        `instance.read` or `audit.read.all`, and a database the caller reaches.
      parameters:
        - name: database
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 63 }
      responses:
        "200":
          description: The tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /observatory/statements:
    get:
      tags: [observatory]
      operationId: getObservatoryStatements
      summary: The statements that cost the server most, from pg_stat_statements
      description: |
        FEAT-071 phase 3. Requires `instance.read` or `audit.read.all`; both a
        DBA and an administrator see the text. Only databases the caller
        reaches. A response carrying any text writes one
        `observatory_text_view` row. 409 when `pg_stat_statements` is not
        installed in Avior's own database.

        The observatory's own statistics reads carry the marker comment
        `/* avior:observatory */` and are left out unless `includeOwn` is true.
        Operators' statements through `avior_governed` are never left out.
      parameters:
        - name: includeOwn
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [total, mean, calls]
            default: total
        - name: database
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The statements, most costly first by the chosen measure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryStatements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: pg_stat_statements is not installed, so there is nothing to read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /observatory/activity:
    get:
      tags: [observatory]
      operationId: getObservatoryActivity
      summary: Statements running now for longer than a threshold
      description: |
        FEAT-071 phase 3, from `pg_stat_activity`, read on request. Requires
        `instance.read` or `audit.read.all`. Only databases the caller
        reaches. A response carrying any text writes one
        `observatory_text_view` row. Nothing here cancels a backend.
      parameters:
        - name: minSeconds
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 86400, default: 60 }
        - name: database
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
      responses:
        "200":
          description: The running statements, longest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryActivity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Find databases, tables, requests, releases and operators by name
      description: |
        FEAT-066. One round trip for every kind the palette lists except pages,
        which the browser matches itself.

        Every hit is filtered by the same access rule as the page it leads to,
        or a stricter one. A kind the caller may not see is left out, never
        refused: a search is not an attempt on any one thing. Tables come from a
        per-replica catalogue snapshot that may be up to five minutes old, and a
        reachable database whose snapshot is still being built contributes no
        table hits and is counted in `indexing`.

        Nothing is audited and the search text is stored nowhere.
      parameters:
        - name: q
          in: query
          required: true
          description: Case-insensitive substring, 2 to 64 characters.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Total hits. A value above 50 is clamped rather than refused, and the
            response reports the value applied. At most 8 hits of each kind are
            returned whatever the limit.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Ranked hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /releases:
    post:
      tags: [release]
      operationId: submitRelease
      summary: Submit a migration ledger entry
      security:
        - releaseToken: []
      description: |
        Called by the database project's CI after a merge, never by an operator.
        Avior does not generate this: steps 1-5 of the pipeline belong to the
        project where the schema files are, and what arrives here has already
        been linted and had its transition verified. See ADR-0004.

        Resubmitting the same commit and migration set returns the entry that
        already exists rather than creating a second one.

        A file whose statements PostgreSQL refuses inside a transaction —
        `CREATE INDEX CONCURRENTLY` and the other concurrent index forms — is
        accepted only when the file declares `-- atlas:txmode none` on a line of
        its own, and then only when it carries nothing else. FEAT-017 AC-12 has
        the four answers and the reason for each.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseSubmission"
      responses:
        "201":
          description: The entry, pending approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "200":
          description: The entry this commit already produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

    get:
      tags: [release]
      operationId: listReleases
      summary: Pending and settled releases
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReleaseState"
        - name: database
          in: query
          required: false
          schema:
            type: string
            maxLength: 63
        - $ref: "#/components/parameters/auditLimit"
        - $ref: "#/components/parameters/auditOffset"
      responses:
        "200":
          description: A page of releases, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /releases/{releaseId}:
    get:
      tags: [release]
      operationId: getRelease
      summary: One release, with its SQL and its drift check
      parameters:
        - $ref: "#/components/parameters/releaseId"
      responses:
        "200":
          description: The release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /releases/{releaseId}/decision:
    post:
      tags: [release]
      operationId: decideRelease
      summary: Approve or reject a release
      description: |
        Needs `release.approve`. A rejection is terminal: CI produces a new entry
        rather than an approver revising a record somebody may already have read.
      parameters:
        - $ref: "#/components/parameters/releaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseDecision"
      responses:
        "200":
          description: The release, settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /releases/{releaseId}/apply:
    post:
      tags: [release]
      operationId: applyRelease
      summary: Apply an approved release to its target
      description: |
        Needs `release.approve`. The drift check runs again here, not only when
        the release was listed: production can move between an approval and an
        apply, and the check that matters is the one closest to the write.

        Each migration file runs in one transaction, recorded against the
        target's `schema_migrations` in that same transaction.

        Except a file declaring `-- atlas:txmode none`, which PostgreSQL will
        not let run in one. That file is recorded as `applying`, run with no
        transaction, then marked `applied` — two records committed on their own.
        A crash between them leaves the `applying` row, and nothing is applied
        to a target holding one: what it holds is not known. FEAT-017 AC-18,
        AC-19.
      parameters:
        - $ref: "#/components/parameters/releaseId"
      responses:
        "200":
          description: The release, applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The migration failed against the target, which is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /databases/{database}/migrations:
    get:
      tags: [release]
      operationId: listAppliedMigrations
      summary: What actually reached one governed database
      security:
        - sessionCookie: []
        - releaseToken: []
      description: |
        FEAT-039. Not the release list: that records what was submitted and
        decided, and this records what a database actually holds and which file
        put it there.

        An operator, or the CI that submits releases. This is the one endpoint
        beyond submission a release token opens, and it is open because a
        submission cannot be computed without it: the digest a release declares
        is taken over a database CI builds by replaying the history the target
        already holds, so CI that cannot ask what the target holds cannot
        produce a correct submission at all. ADR-0004 step 6.

        It reads, and changes nothing. What comes back is the filenames and the
        SQL of migrations CI submitted in the first place.

        The two are reconciled rather than one being reported. Avior's ledger
        and the target's own `schema_migrations` can disagree in three ways —
        a file the target ran that Avior never submitted, one filename with two
        bodies, and a file an applied release claims ran that the target does
        not corroborate — and every one of them is listed rather than hidden.

        `table` narrows the list. A migration whose relations could not be
        determined is included in every table filter: excluding it would let a
        caller filter on a table, see a complete-looking list, and miss a
        migration that altered it.
      parameters:
        - name: database
          in: path
          required: true
          description: A governed database. Avior's own store is not one.
          schema:
            type: string
            maxLength: 63
        - name: table
          in: query
          required: false
          description: |
            Narrow to the migrations naming this table. Unqualified matches any
            schema; `public.bet` matches only that one.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: The reconciled history, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedMigrationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The target could not be read, which is not an empty history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/preconditions:
    get:
      tags: [provision]
      operationId: readProvisionPreconditions
      summary: What a governed database needs before a release can reach it
      description: |
        Needs `provision.manage`. Reports whether the database exists, whether
        each named role exists, and whether the deploy credential is a member of
        the database's owner role — which is what lets a migration ALTER what is
        already there. FEAT-059 AC-2.

        Reading this changes nothing and is not audited.
      parameters:
        - name: database
          in: query
          required: true
          schema:
            type: string
          description: The governed database a release is targeting.
        - name: role
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: |
            The roles the migrations grant to. A submission declares these; this
            parameter is how the page asks about them before one exists.
      responses:
        "200":
          description: What is present and what is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionPreconditions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/databases:
    post:
      tags: [provision]
      operationId: provisionDatabase
      summary: Create a governed database, its owner role and the membership
      description: |
        Needs `provision.manage`. Creates the database, creates
        `<name>_schema_owner`, and grants the deploy credential membership of it
        — the three together, because a database whose owner role nobody is a
        member of accepts no migration. FEAT-059 AC-4.

        Creating one that exists is not an error: the page somebody read before
        clicking may be a moment old. FEAT-059 AC-7.

        The name is an identifier, never SQL. FEAT-059 AC-6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: What was created, and what was already there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/roles:
    post:
      tags: [provision]
      operationId: provisionRole
      summary: Create a role that does not log in
      description: |
        Needs `provision.manage`. A group role carrying permissions, never
        connected as — the shape every database project in this estate grants
        to. FEAT-059 AC-5.

        It exists so a DBA is not blocked when a project's migration names a
        role the project has not yet learned to ship. Where the project does
        ship it, this is not the path it takes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: What was created, and what was already there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"
    get:
      tags: [provision]
      operationId: listProvisionedRoles
      summary: The roles this Avior administers
      description: |
        Needs `provision.manage`. Every role the provisioning credential holds
        ADMIN over — which, on PostgreSQL 16 and later, is every role it
        created: the owner roles, the group roles, and the logins. A role a DBA
        made by hand is not here, and cannot be changed from here. FEAT-061 AC-8.

        Named a database, the answer is about that database alone: its owner
        role, the roles that may connect to it, those holding a privilege on or
        owning an object in it, and the members of any of those — never a role
        only because its name contains the database's (FEAT-076 AC-15) — and
        what each may do is read inside that one database rather than every
        one. A server with many governed databases is asked one question at a
        time, which is what keeps this page from opening every database it
        holds to draw a list.
      parameters:
        - name: database
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,62}$"
            maxLength: 63
      responses:
        "200":
          description: The roles, whether each may log in, and what each is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProvisionedRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/roles/{name}:
    delete:
      tags: [provision]
      operationId: dropProvisionedRole
      summary: Drop a role this Avior created
      description: |
        Needs `provision.manage`. `DROP ROLE`, never `CASCADE`: a role that
        still owns something is refused with PostgreSQL's own reason, and
        nothing is cleaned up on the caller's behalf. FEAT-061 AC-4.

        Refused by name for Avior's own credentials, `postgres`, and every
        `*_schema_owner` — an owner role owns a database, and a database is not
        removed from this page. Refused for a role the provisioning credential
        did not create, because PostgreSQL refuses it too. FEAT-061 AC-5.
      parameters:
        - $ref: "#/components/parameters/RoleName"
      responses:
        "204":
          description: Dropped
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The role still owns something, so PostgreSQL refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/databases/{name}/connect:
    post:
      tags: [provision]
      operationId: grantDatabaseConnect
      summary: Let a role connect to a governed database
      description: |
        Needs `provision.manage`. `GRANT CONNECT ON DATABASE` the database to
        the role, run as the database's owner role. FEAT-076 AC-2.

        FEAT-059 revokes everything on a new database from `PUBLIC`, so the
        group role a project's migrations grant to holds every table and still
        cannot open a connection until this is done. It cannot travel in the
        migration instead: the statement names the database, and one migration
        directory is applied to databases of different names.

        Refused for `postgres`, `pg_*`, `avior*`, the deploy and read roles and
        every `*_schema_owner`. A role that may already connect is reported as
        unchanged rather than refused. FEAT-076 AC-3, AC-4.
      parameters:
        - $ref: "#/components/parameters/DatabaseName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectGrantRequest"
      responses:
        "200":
          description: Granted, or already held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The provisioning credential cannot act as the database's owner role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/databases/{name}/writes:
    post:
      tags: [provision]
      operationId: prepareDatabaseForWrites
      summary: Bring a governed database under the write path
      description: |
        Needs `provision.manage`. Creates the `avior_backup` schema and the
        capture table a write keeps what it overwrote in, and grants the writer
        credential Avior is configured with what a write needs — on the tables
        there now and, by default privileges recorded for the owner role, on
        every table a release adds later. FEAT-076 AC-8.

        No password is sent or set. The writer role is the one named in
        `AVIOR_WRITE_DSN`; where it does not exist on the server this is refused
        rather than creating it, because the role and its password are made once
        per cluster by `deploy/store/bootstrap.sql`. FEAT-076 AC-9, AC-10.

        Idempotent: a database already prepared is reported as unchanged.
      parameters:
        - $ref: "#/components/parameters/DatabaseName"
      responses:
        "200":
          description: Prepared, or already prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The writer role is not on the server, or the provisioning credential
            cannot act as the database's owner role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/roles/{name}/access:
    get:
      tags: [provision]
      operationId: readRoleAccess
      summary: Everything one role may do in one governed database, and why
      description: |
        Needs `provision.manage`. Whether the role may CONNECT and through
        which grantees; every governed database it may connect to; and each
        table and routine in the database with the privileges the role holds
        on it, each naming the roles that hold it directly — the role itself,
        a group it inherits from, the owner, or PUBLIC. FEAT-076 AC-18.

        At most 500 tables and 500 routines; `truncated` says when there were
        more. Reading this changes nothing and is not audited.
      parameters:
        - $ref: "#/components/parameters/RoleName"
        - name: database
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,62}$"
            maxLength: 63
      responses:
        "200":
          description: The role's reach into the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/logins:
    post:
      tags: [provision]
      operationId: provisionLogin
      summary: Create a role that logs in, with a password shown once
      description: |
        Needs `provision.manage`. Avior generates the password, sends the server
        a SCRAM-SHA-256 verifier rather than the password itself, and returns the
        password in this response and nowhere else: not in its store, not in the
        audit, not in a log. Whoever asked for it stores it — in OpenBao, for an
        application. FEAT-061 AC-1, AC-2.

        A name that already exists is refused rather than reset: resetting a
        password is its own act, below. FEAT-061 AC-1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginProvisionRequest"
      responses:
        "201":
          description: The login, and the only copy of its password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionedLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A role of that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /provision/logins/{name}/password:
    post:
      tags: [provision]
      operationId: rotateLoginPassword
      summary: Replace a login's password with a new one, shown once
      description: |
        Needs `provision.manage`. The same generation and the same one-time
        answer as creating the login. Connections already open keep working;
        the next one needs the new password. FEAT-061 AC-3.
      parameters:
        - $ref: "#/components/parameters/RoleName"
      responses:
        "200":
          description: The login, and the only copy of its new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionedLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /writes:
    get:
      tags: [write]
      operationId: listWriteRequests
      summary: Write requests
      description: |
        FEAT-009. Needs `query.execute`, and answers with everybody's.

        A write against a governed database is not a private matter: it is a
        change to data a team owns, and the audit trail is already read that
        way. Filtering the list to the reader's own made the page empty for
        everyone who had not asked for something, which is most people most of
        the time — including the person who came to approve one.

        `mine` narrows it to the reader's own when that is the question.
      parameters:
        - name: mine
          in: query
          required: false
          description: Only the reader's own requests.
          schema:
            type: boolean
            default: false
        - name: state
          in: query
          required: false
          description: Empty means every state.
          schema:
            $ref: "#/components/schemas/WriteRequestState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WriteRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [write]
      operationId: submitWriteRequest
      summary: Ask for a row change
      description: |
        Needs `query.execute`. The statement is evaluated against the write
        guard before anything is recorded, so a refusal creates no request.

        Where approval is required the request waits. Where it is not, the
        statement runs on submission and the response carries the outcome —
        the guard, the backup and the audit are unchanged either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteSubmission"
      responses:
        "201":
          description: The request, waiting or already run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The guard refused the statement, or this deployment has no write
            credential. The reasons name the rule that fired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRefusal"

  /writes/template:
    post:
      tags: [write]
      operationId: buildWriteTemplate
      summary: Build the skeleton of a write over the named columns
      description: |
        FEAT-009. Returns the statement an operator starts from, with the values
        and the predicate left empty: those are their decision, and a generated
        guess at either is the one thing this must not supply.

        The predecessor's version of this generated two halves, the first copying the
        rows into a backup table by hand. Only the second is generated here —
        the backup is taken by the executor inside the write's own transaction,
        whether or not anybody remembered to write a statement for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteTemplateRequest"
      responses:
        "200":
          description: The generated skeleton, which the guard refuses until it is finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /writes/inspect:
    post:
      tags: [write]
      operationId: inspectWriteRequest
      summary: Check a write against the guard without recording it
      description: |
        Needs `query.execute`. Runs the whole guard — the parser, the plan, the
        column and database rules — and records nothing. It exists so an
        operator can see how many rows their statement would touch before
        asking somebody to approve it, and so a refusal costs a request nobody
        had to read.

        `EXPLAIN` without `ANALYZE`, inside a read-only transaction: nothing
        runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteInspection"
      responses:
        "200":
          description: What the guard decided, and what it would touch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteVerdict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The deployment has no write credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRefusal"

  /writes/captures:
    get:
      tags: [write]
      operationId: listWriteCaptures
      summary: The backups that have accumulated
      description: |
        Needs `instance.maintain`. Oldest first, with anything past seven days
        marked. Nothing is removed on a schedule: a capture is the only copy of
        rows somebody changed, and a job deleting it by age would eventually
        delete the one somebody needed at the moment they needed it.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Captures, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WriteCapture"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /writes/{writeId}:
    get:
      tags: [write]
      operationId: getWriteRequest
      summary: One write request
      parameters:
        - $ref: "#/components/parameters/writeId"
      responses:
        "200":
          description: The request and what happened to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /writes/{writeId}/decision:
    post:
      tags: [write]
      operationId: decideWriteRequest
      summary: Approve or refuse a write request
      description: |
        Needs `write.approve`. Approving runs the statement, so there is no
        state in which somebody has agreed and nothing has happened.

        A requester cannot decide their own request whatever roles they hold:
        the second person is the whole of the check.
      parameters:
        - $ref: "#/components/parameters/writeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteDecision"
      responses:
        "200":
          description: The request, decided and run if it was approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /writes/{writeId}/withdrawal:
    post:
      tags: [write]
      operationId: withdrawWriteRequest
      summary: Take back a waiting request
      description: |
        Needs `query.execute`, and only the requester may. Once decided it
        cannot be withdrawn: the record of what was approved does not change
        afterwards.
      parameters:
        - $ref: "#/components/parameters/writeId"
      responses:
        "200":
          description: The request, withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /writes/{writeId}/rollback:
    post:
      tags: [write]
      operationId: rollbackWriteRequest
      summary: Put back the rows a write changed
      description: |
        Needs `write.approve`. Creates a **new write request** carrying the
        reverse statement and runs it: its own row, its own backup, its own
        reverse statement, and its own line in the record. That is what makes
        the rollback of a rollback an ordinary thing rather than a question
        nobody thought about — undo the rollback's own request.

        Its author approves it, which no other write may do. Two things make
        that narrowing safe rather than a hole in the model: the statement is
        regenerated here from the request being undone and the table's shape as
        it is now, so nothing an operator typed reaches it; and it can only put
        back what a previous approved write took away, keyed by that write's own
        capture, so there is no predicate to get wrong.

        It does not go through the write guard, and cannot: the reverse of a
        `DELETE` reads the capture table, which is a second table and a
        `SELECT`. The safety here is provenance rather than parsing, and that is
        what lets the guard's subset stay as narrow as it is.
      parameters:
        - $ref: "#/components/parameters/writeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRollback"
      responses:
        "200":
          description: The rollback request, run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /writes/{writeId}/capture:
    delete:
      tags: [write]
      operationId: removeWriteCapture
      summary: Remove the rows one request kept
      description: |
        Needs `instance.maintain`. The request keeps its record and reads
        afterwards as no longer reversible. Only the rows go.
      parameters:
        - $ref: "#/components/parameters/writeId"
      responses:
        "200":
          description: The request, no longer reversible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    releaseToken:
      type: http
      scheme: bearer
      description: |
        A machine caller's token, issued to the database project's CI. It is not
        an operator session and cannot approve or apply anything.
    sessionCookie:
      type: apiKey
      in: cookie
      name: avior_session

  parameters:
    RequestedBy:
      name: X-Avior-Requested-By
      in: header
      required: false
      description: |
        FEAT-063 AC-8. Who the caller says asked for this — an agent serving a
        Slack channel names the person in it. Recorded on the audit row and
        read for nothing else: it is not verified, and nothing about what the
        request may do depends on it.
      schema:
        type: string
        maxLength: 200
    DatabaseName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,62}$"
        maxLength: 63
    RoleName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,62}$"
        maxLength: 63
    operatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    lineageSchema:
      name: schema
      in: query
      required: false
      description: The focus's schema, when it is given by name.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    lineageName:
      name: name
      in: query
      required: false
      description: The focus's name, exactly as stored, when it is given by name.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    lineageKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/LineageFocusKind"
    lineageSignature:
      name: signature
      in: query
      required: false
      description: |
        A routine's identity arguments, as PostgreSQL prints them, and empty
        for a routine that takes none. Needed only when the name alone is
        ambiguous; an ambiguous routine without it is `422
        lineage.routine_ambiguous`.
      schema:
        type: string
        maxLength: 1024
    instanceId:
      name: instanceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    database:
      name: database
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    objectType:
      name: type
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ObjectType"

    writeId:
      name: writeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    releaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    auditFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on submission time.
      schema:
        type: string
        format: date-time
    auditTo:
      name: to
      in: query
      required: false
      description: Inclusive upper bound on submission time.
      schema:
        type: string
        format: date-time
    auditLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size. A value above the maximum is clamped rather than refused, and
        the response reports what it was clamped to.
      schema:
        type: integer
        minimum: 1
        default: 50
    auditOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    histogramFrom:
      name: from
      in: query
      required: false
      description: Inclusive start of the window.
      schema:
        type: string
        format: date-time
    histogramTo:
      name: to
      in: query
      required: false
      description: Exclusive end of the window, at most 168 hours after `from`.
      schema:
        type: string
        format: date-time
    auditOperator:
      name: operator
      in: query
      required: false
      description: Substring of the operator's username.
      schema:
        type: string
        maxLength: 128
    auditStatement:
      name: statement
      in: query
      required: false
      description: Substring of the submitted statement.
      schema:
        type: string
        maxLength: 200
    auditDecision:
      name: decision
      in: query
      required: false
      schema:
        type: string
        enum: [allow, deny]

  responses:
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Request failed schema or semantic validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        The account has spent its statement budget for the rolling window
        (FEAT-006). The message names the budget and the wait, and the
        submission is still audited.
      headers:
        Retry-After:
          description: Whole seconds until the budget admits another submission.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The session is valid but lacks the permission this endpoint needs
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The release is not in a state that allows this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The named object does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotConfigured:
      description: |
        This deployment has not been given a release target, so the feature is
        switched off rather than broken. Not 5xx: nothing failed, and a fault
        code would send the reader looking for an outage.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ReleaseState:
      type: string
      enum: [pending, approved, rejected, applied, failed]

    LintFinding:
      type: object
      required: [rule, severity, message]
      additionalProperties: false
      properties:
        rule:
          type: string
        severity:
          type: string
          enum: [advice, warning, blocking]
        object:
          type: string
        message:
          type: string

    MigrationFile:
      type: object
      required: [filename, sql]
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 200
        sql:
          type: string
          minLength: 1

    ReleaseSubmission:
      type: object
      description: |
        What the database project's CI hands over. Everything here is the output
        of a pipeline step Avior did not run and cannot repeat, which is why it
        is submitted rather than derived.
      required: [database, commitSha, author, migrations, expectedSchemaDigest]
      additionalProperties: false
      properties:
        database:
          type: string
          minLength: 1
          maxLength: 63
          description: The target database on the governed server.
        commitSha:
          type: string
          pattern: "^[0-9a-f]{7,40}$"
        mergeRequestUrl:
          type: string
        author:
          type: string
          minLength: 1
          maxLength: 200
        migrations:
          type: array
          minItems: 1
          description: In the order they must be applied.
          items:
            $ref: "#/components/schemas/MigrationFile"
        lintFindings:
          type: array
          items:
            $ref: "#/components/schemas/LintFinding"
        verifyResult:
          type: object
          description: |
            Step 3 of the pipeline: a fresh database replayed to production's
            revision, the migration applied, the result asserted equal to the
            declarative schema files.
          additionalProperties: false
          properties:
            passed:
              type: boolean
            detail:
              type: string
            againstProductionRestore:
              type: boolean
        stagingSyncedAt:
          type: string
          format: date-time
        expectedSchemaDigest:
          type: string
          minLength: 16
          maxLength: 128
          description: |
            The digest the target is expected to hold *before* this migration —
            computed by CI over the database it built by replaying the migration
            history. Avior computes the target's real digest and refuses when the
            two disagree, because that means production moved by hand.

            `avior:empty-schema` where the target is expected to hold nothing,
            which is what a baseline says: the database was created and nothing
            has been applied to it. It is a phrase rather than a hash so it
            cannot collide with one, and CI produces it from the same
            `cmd/schemadigest` Avior compares with — so a baseline lands on an
            empty database and is refused by a populated one, and a migration
            carrying a hash is refused by an empty one.

    Release:
      type: object
      required: [id, database, commitSha, author, state, migrationChecksum, submittedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        database:
          type: string
        commitSha:
          type: string
        mergeRequestUrl:
          type: string
        author:
          type: string
        state:
          $ref: "#/components/schemas/ReleaseState"
        migrationChecksum:
          type: string
        migrationCount:
          type: integer
        submittedAt:
          type: string
          format: date-time

    AppliedMigrationList:
      type: object
      required: [database, migrations]
      additionalProperties: false
      properties:
        database:
          type: string
        migrations:
          type: array
          items:
            $ref: "#/components/schemas/AppliedMigration"

    AppliedMigration:
      type: object
      required: [filename, status, relationsKnown]
      additionalProperties: false
      properties:
        filename:
          type: string
        status:
          type: string
          enum: [recorded, unaccounted, mismatched, missing]
          description: |
            How the two ledgers agree. `recorded` is the ordinary case.
            `unaccounted` is a file the target ran that Avior never submitted,
            so something reached this database by a path Avior does not govern.
            `mismatched` is one filename with two bodies. `missing` is a file an
            applied release claims ran that the target does not corroborate.
            Every one but the first is reported, not resolved.
        appliedAt:
          type: string
          format: date-time
          nullable: true
          description: Absent on a missing file, because nothing applied it.
        sql:
          type: string
          description: |
            The SQL as it was submitted. Empty for an unaccounted file, because
            Avior never saw it — which is not a file whose body was empty.
        relations:
          type: array
          items:
            type: string
        relationsKnown:
          type: boolean
          description: |
            False when the file could not be read — a DO block, a statement
            built by format(), a shape the extractor was never taught. Such a
            file appears under every table filter rather than none.
        targetChecksum:
          type: string
        ledgerChecksum:
          type: string
          description: |
            Both checksums are shown on a mismatch, because neither is known to
            be the right one.
        release:
          $ref: "#/components/schemas/Release"

    ColumnPolicy:
      type: object
      required: [restrictions, unlocks]
      additionalProperties: false
      properties:
        restrictions:
          type: array
          items:
            $ref: "#/components/schemas/ColumnRestriction"
        unlocks:
          type: array
          items:
            $ref: "#/components/schemas/ColumnUnlock"

    ColumnChange:
      type: object
      required: [actor, database, object, column, role, action, reason, changedAt]
      additionalProperties: false
      properties:
        actor:
          type: string
          description: Who made it. Empty when the deployment's seed did.
        database: { type: string }
        object: { type: string }
        column: { type: string }
        role:
          type: string
          description: Empty for a restriction, which is about the column rather than a role.
        action:
          type: string
          enum: [restrict, unrestrict, unlock, lock]
        reason: { type: string }
        expiresAt: { type: string, format: date-time }
        changedAt: { type: string, format: date-time }

    ColumnRestriction:
      type: object
      required: [database, object, column, reason, createdAt]
      additionalProperties: false
      properties:
        database: { type: string }
        object: { type: string }
        column: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    ColumnUnlock:
      type: object
      required: [database, object, column, role, reason, grantedBy, grantedAt, expired]
      additionalProperties: false
      properties:
        database: { type: string }
        object: { type: string }
        column: { type: string }
        role: { type: string }
        reason: { type: string }
        grantedBy:
          type: string
          description: Who allowed it. Empty when the deployment's seed did.
        grantedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Absent when the unlock lasts until somebody removes it.
        expired:
          type: boolean
          description: |
            Whether it has already ended. Computed by the server, because the
            expiry is compared against the database's clock and a browser's may
            disagree with it.

    DatabaseGrantChange:
      type: object
      required: [actor, role, database, action, reason, changedAt]
      additionalProperties: false
      properties:
        actor:
          type: string
          description: Who changed it. Empty when the deployment's seed did.
        role:
          type: string
        database:
          type: string
        action:
          type: string
          enum: [grant, revoke]
        reason:
          type: string
        changedAt:
          type: string
          format: date-time

    DatabaseGrant:
      type: object
      required: [role, database, reason, grantedAt]
      additionalProperties: false
      properties:
        role:
          type: string
        database:
          type: string
        reason:
          type: string
        grantedAt:
          type: string
          format: date-time

    RoleDetail:
      type: object
      required: [name, label, summary, administrable, permissions]
      additionalProperties: false
      properties:
        name:
          type: string
          description: The role as it is stored and as the guard reads it.
        label:
          type: string
        summary:
          type: string
        administrable:
          type: boolean
          description: |
            Whether this page may grant or revoke it. False for `administrator`,
            which is provisioned outside the application.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDetail"

    PermissionDetail:
      type: object
      required: [name, summary]
      additionalProperties: false
      properties:
        name:
          type: string
        summary:
          type: string

    Operator:
      type: object
      required: [id, username, kind, roles, disabled, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        kind:
          type: string
          enum: [person, service]
          description: |
            FEAT-063. `service` is an account for an agent that is nobody's
            person: administered here like anybody's, never an administrator,
            and never signed in to.
        roles:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ReleaseDetail:
      type: object
      required:
        [
          release,
          migrations,
          lintFindings,
          driftCheck,
          approvals,
          applications,
          relationSizes,
          relationsKnown,
          readiness,
        ]
      additionalProperties: false
      properties:
        release:
          $ref: "#/components/schemas/Release"
        migrations:
          type: array
          items:
            $ref: "#/components/schemas/MigrationFile"
        relationSizes:
          type: array
          description: |
            How big each relation these migrations name is on the target, read
            when the release is read. `CREATE INDEX` without `CONCURRENTLY`
            reaches production under approval, and how long it holds the lock
            depends on this and on nothing else here. Empty when the target
            could not be asked — reading it is a diagnostic and never fails a
            release. FEAT-017 AC-21.
          items:
            $ref: "#/components/schemas/RelationSize"
        relationsKnown:
          type: boolean
          description: |
            False when some file's relations could not be extracted, which makes
            `relationSizes` an incomplete list rather than a short one. Shown,
            because a list that silently omits the big table is the failure
            AC-21 exists to prevent.
        readiness:
          $ref: "#/components/schemas/Readiness"
        lintFindings:
          type: array
          items:
            $ref: "#/components/schemas/LintFinding"
        verifyResult:
          type: object
          additionalProperties: true
          nullable: true
        driftCheck:
          $ref: "#/components/schemas/DriftCheck"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseApproval"
        applications:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseApplication"

    RelationSize:
      type: object
      required: [relation, inTarget, rows, totalBytes]
      additionalProperties: false
      properties:
        relation:
          type: string
          description: The relation as the migration named it, qualified or not.
        inTarget:
          type: boolean
          description: |
            False when the target's catalogue does not hold this relation at
            all, which is usually because this migration is what creates it.
        rows:
          type: integer
          format: int64
          nullable: true
          description: |
            PostgreSQL's own estimate, from `pg_class.reltuples`. Null rather
            than zero whenever there is no estimate — the relation is not there,
            or it has never been analysed. An approver reading `0 rows` for a
            table holding forty million would judge the lock wrongly, so a
            figure Avior could not obtain is never rendered as a real one.
        totalBytes:
          type: integer
          format: int64
          nullable: true
          description: |
            `pg_total_relation_size`: the table with its indexes and its TOAST.
            Null on the same terms as `rows`.

    Readiness:
      type: object
      description: |
        Whether this release could be applied right now, asked when the entry is
        read rather than when somebody presses apply.

        Not the drift check below. That one is the record of a comparison made
        on the way to a write; this is a question asked by whoever opened the
        page, and nothing is written for it. Absent on a settled release: the
        answer would be about a target the release itself has since changed.
      required: [result, databaseExists]
      additionalProperties: false
      nullable: true
      properties:
        result:
          type: string
          enum: [match, drifted, unavailable, missing]
          description: |
            `missing` is a database the governed server does not hold. It is the
            one outcome somebody can act on from inside Avior, which is why it
            is not folded into `unavailable`.

            A database that exists and holds nothing is not a fourth case: it
            digests to `avior:empty-schema`, which a baseline's submission
            carries too, so it reports as `match` like any other agreement.
        databaseExists:
          type: boolean
        detail:
          type: string

    DriftCheck:
      type: object
      required: [result, checkedAt]
      additionalProperties: false
      nullable: true
      properties:
        result:
          type: string
          enum: [match, drifted, unavailable]
          description: |
            `unavailable` is not a pass. A digest that cannot be computed refuses
            the apply, because a drift check that failed open would be believed.
        checkedAt:
          type: string
          format: date-time
        expectedDigest:
          type: string
        actualDigest:
          type: string
        detail:
          type: string

    ReleaseApproval:
      type: object
      required: [approver, decision, decidedAt]
      additionalProperties: false
      properties:
        approver:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
        decidedAt:
          type: string
          format: date-time

    ReleaseApplication:
      type: object
      required: [appliedBy, startedAt, result]
      additionalProperties: false
      properties:
        appliedBy:
          type: string
        startedAt:
          type: string
          format: date-time
        result:
          type: string
          enum: [succeeded, failed]
        durationMs:
          type: integer
        filesApplied:
          type: integer
        error:
          type: string
        invalidIndexes:
          type: array
          description: |
            Indexes the target held that PostgreSQL had marked unusable when
            this release ran, on a succeeded application as well as a failed
            one. A `CREATE INDEX CONCURRENTLY` that failed did not roll back and
            left one behind; it takes no part in query planning and re-running
            the migration does not repair it, because the name is taken. It has
            to be dropped. FEAT-017 AC-20.
          items:
            type: string

    ProvisionRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          # An identifier, never SQL. The pattern is the refusal: a name that
          # does not match it never reaches the server, so there is no quoting
          # question to get wrong. Lower case because PostgreSQL folds unquoted
          # identifiers, and a name that needed quotes at every call site is a
          # name this estate does not use.
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          maxLength: 63

    ProvisionResult:
      type: object
      required: [objects]
      additionalProperties: false
      properties:
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ProvisionedObject"

    ConnectGrantRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          maxLength: 63

    LoginProvisionRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          maxLength: 63
        memberOf:
          type: array
          maxItems: 16
          description: |
            Group roles the login is granted on creation — the `role_<service>`
            a project's migrations grant to. Each must already exist and be one
            this Avior administers.
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,62}$"
            maxLength: 63

    ProvisionedLogin:
      type: object
      required: [name, password, memberOf]
      additionalProperties: false
      properties:
        name:
          type: string
        password:
          type: string
          description: Shown here and never again. Avior keeps no copy.
        memberOf:
          type: array
          items:
            type: string

    ProvisionedRole:
      type: object
      required: [name, kind, canLogin, memberOf, members, grants]
      additionalProperties: false
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [login, group, owner]
          description: |
            `owner` is a database's `<db>_schema_owner`: it owns the schema, is
            never joined from here, and is never dropped from here.
        canLogin:
          type: boolean
        memberOf:
          type: array
          items:
            type: string
        members:
          type: array
          description: Who holds this role — for a group, the logins it carries.
          items:
            type: string
        grants:
          type: array
          description: |
            What the role may do, in each governed database it may connect to,
            membership included. A login with no membership and no grant of its
            own has an empty list: it can connect to nothing governed.

            A database is listed only where the role may CONNECT to it, so a
            list asked about one database that does not name it means the role
            cannot connect there — not that it holds nothing. FEAT-076 AC-14.
          items:
            $ref: "#/components/schemas/DatabaseGrantSummary"

    DatabaseGrantSummary:
      type: object
      required: [database, tables, select, insert, update, delete]
      additionalProperties: false
      properties:
        database:
          type: string
        tables:
          type: integer
          description: Tables and views in the database, for the counts to be read against.
        select:
          type: integer
        insert:
          type: integer
        update:
          type: integer
        delete:
          type: integer
        unreadable:
          type: boolean
          description: |
            The role may connect, but Avior could not look inside — the
            database vanished between two reads, or the read credential cannot
            enter it. The counts are then meaningless and are zero.
        canConnect:
          type: boolean
          description: |
            Whether the role may CONNECT, membership included. False only on a
            list asked about one database, where a role holding privileges or
            ownership inside it is listed whether or not it can connect.
            FEAT-076 AC-14.
        owned:
          type: integer
          description: |
            How many of the tables the role owns, itself or through a role it
            inherits from. An owner holds every privilege without a GRANT.
            FEAT-076 AC-16.

    RoleAccess:
      type: object
      required: [role, database, canConnect, connectVia, connectable, tables, functions, truncated]
      additionalProperties: false
      properties:
        role:
          type: string
        database:
          type: string
        canConnect:
          type: boolean
        connectVia:
          type: array
          description: The grantees whose CONNECT reaches the role — itself, a group, or PUBLIC.
          items:
            type: string
        connectable:
          type: array
          description: |
            Every governed database the role may connect to, each with the
            grantees its CONNECT comes through — PUBLIC where the database never
            revoked it.
          items:
            $ref: "#/components/schemas/ConnectableDatabase"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/ObjectAccess"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/ObjectAccess"
        truncated:
          type: boolean

    ConnectableDatabase:
      type: object
      required: [database, via]
      additionalProperties: false
      properties:
        database:
          type: string
        via:
          type: array
          items:
            type: string

    ObjectAccess:
      type: object
      required: [schema, name, kind, owner, owned, privileges, columns]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
          description: A routine's name carries its argument types.
        kind:
          type: string
          description: The relkind of a table (`r`, `p`, `v`, `m`), or `function` / `procedure`.
        owner:
          type: string
        owned:
          type: boolean
          description: The role is the owner, or inherits from it.
        privileges:
          type: array
          items:
            $ref: "#/components/schemas/PrivilegeSource"
        columns:
          type: array
          description: |
            Column-level grants on a table: a privilege on some of its columns
            the role does not hold on the table as a whole. Empty for a routine.
          items:
            $ref: "#/components/schemas/ColumnPrivilege"

    ColumnPrivilege:
      type: object
      required: [privilege, columns, via]
      additionalProperties: false
      properties:
        privilege:
          type: string
          enum: [SELECT, INSERT, UPDATE, REFERENCES]
        columns:
          type: array
          items:
            type: string
        via:
          type: array
          items:
            type: string

    PrivilegeSource:
      type: object
      required: [privilege, via]
      additionalProperties: false
      properties:
        privilege:
          type: string
          enum: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER, EXECUTE]
        via:
          type: array
          description: |
            The grantees holding it directly. The role's own name is a direct
            grant; the owner's is ownership; PUBLIC is everybody.
          items:
            type: string

    ProvisionedObject:
      type: object
      required: [kind, name, created]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [database, role, membership, access, connect, writes]
          description: |
            `access` is the grants a database needs before Avior can use it:
            CONNECT for the deploy and read credentials, the schema's ownership
            and its USAGE, and the default privileges that carry a SELECT to the
            read credential for every table a release adds later. Applied inside
            the database rather than beside it, which is why it is its own act.

            `connect` is a role granted CONNECT on a database, named
            `<role>@<database>`. `writes` is a database brought under the write
            path, named for the database. FEAT-076.
        name:
          type: string
        created:
          type: boolean
          description: |
            False where it was already there. Not an error: two people reading
            the same preconditions page both act on what it said.

            `access` reports true whenever the grants were applied, which is
            every time: they are idempotent, and re-applying them is how a
            database provisioned before they existed is repaired.

    ProvisionPreconditions:
      type: object
      required: [database, databaseExists, roles, deployerOwnsSchema]
      additionalProperties: false
      properties:
        database:
          type: string
        databaseExists:
          type: boolean
        ownerRole:
          type: string
          description: The role that owns what the schema puts in the database.
        ownerRoleExists:
          type: boolean
        deployerOwnsSchema:
          type: boolean
          description: |
            Whether the deploy credential is a member of the owner role. Without
            it a migration may add objects and may not change the ones already
            there, because ALTER is ownership rather than a privilege.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RolePresence"
        writes:
          $ref: "#/components/schemas/WriteReadiness"

    RolePresence:
      type: object
      required: [name, exists]
      additionalProperties: false
      properties:
        name:
          type: string
        exists:
          type: boolean
        canConnect:
          type: boolean
          description: |
            Whether the role may CONNECT to the database, membership included.
            Present only where the role exists and the database is a governed
            one that exists. FEAT-076 AC-1.

    WriteReadiness:
      type: object
      description: |
        Whether the database is under the write path. Absent where the database
        does not exist, is not one Avior governs, or no writer credential is
        configured. FEAT-076 AC-7.
      required: [writerRole, prepared, missing]
      additionalProperties: false
      properties:
        writerRole:
          type: string
          description: The role a write runs as, from `AVIOR_WRITE_DSN`.
        prepared:
          type: boolean
        missing:
          type: array
          description: |
            What preparing would add. `writer_role` alone means the role is not
            on the server, which preparing does not fix: `bootstrap.sql` creates
            it, once per cluster.
          items:
            type: string
            enum:
              - writer_role
              - connect
              - capture_table
              - capture_grants
              - table_grants
              - default_privileges

    ReleaseDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 1000

    ReleasePage:
      type: object
      required: [releases, pageSize, hasMore]
      additionalProperties: false
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
        pageSize:
          type: integer
        hasMore:
          type: boolean

    AuditPage:
      type: object
      required: [entries, pageSize, hasMore]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        pageSize:
          type: integer
          description: |
            The page size actually applied. Differs from the requested limit
            when that limit was above the maximum.
        hasMore:
          type: boolean

    AuditEntry:
      type: object
      required: [id, operator, instanceId, database, statement, decision, reasons, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        operator:
          type: string
        instanceId:
          type: string
          format: uuid
        database:
          type: string
        statement:
          type: string
        decision:
          type: string
          enum: [allow, deny]
        reasons:
          type: array
          description: Empty when the decision is allow. Never empty when deny.
          items:
            $ref: "#/components/schemas/GuardReason"
        rowCount:
          type: integer
          nullable: true
          description: |
            Absent when the statement never ran - a denial, or an inspect probe.
            Absent is not zero.
        elapsedMs:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable code. Never localise this.
          example: guard.column_denied
        message:
          type: string
          description: Operator-facing text. Safe to display.
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      required: [status, version, dependencies]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        dependencies:
          type: array
          items:
            type: object
            required: [name, status]
            additionalProperties: false
            properties:
              name:
                type: string
              status:
                type: string
                enum: [ok, down]
              detail:
                type: string

    LoginRequest:
      type: object
      description: |
        Only the username is always required. Which of the other fields matter
        depends on how the deployment authenticates: the directory wants a
        password and no TOTP code, a local development stack wants neither, and
        the interim store-backed mode wants both. The contract therefore carries
        them as optional and leaves the verifier to insist.
      required: [username]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          maxLength: 256
          format: password
        totp:
          type: string
          pattern: "^([0-9]{6})?$"

    TableRef:
      type: object
      required: [schema, name, kind]
      additionalProperties: false
      description: |
        A partition is never listed. Its parent is, once, as `partitioned`,
        with `partitions` saying how many it has; `/schema/partitions` names
        them.
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [table, view, partitioned]
        partitions:
          type: integer
          description: Set on a partitioned table, its direct partitions.

    TablePartitioning:
      type: object
      required: [schema, name, partitions, warnings]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
        parent:
          $ref: "#/components/schemas/PartitionParent"
        strategy:
          type: string
          enum: [range, list, hash]
          description: Set on a partitioned table.
        key:
          type: string
          description: The key as PostgreSQL renders it, for instance "RANGE (id)".
        approxRows:
          type: number
          format: double
          nullable: true
          description: |
            The planner's estimate over every leaf partition that has been
            analysed, null when none has. Approximate, never a count.
        totalBytes:
          type: integer
          format: int64
          description: Every partition's tables, indexes and TOAST, together.
        partitions:
          type: array
          description: |
            A range's partitions by upper bound, lowest first, an open-ended
            one after the bounded ones; the DEFAULT partition last.
          items:
            $ref: "#/components/schemas/PartitionEntry"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PartitionWarning"

    PartitionParent:
      type: object
      required: [schema, name, bound]
      additionalProperties: false
      description: Set when the table asked about is itself a partition.
      properties:
        schema:
          type: string
        name:
          type: string
        bound:
          type: string
          description: This partition's bound, as PostgreSQL renders it.

    PartitionEntry:
      type: object
      required: [schema, name, bound, isDefault, partitioned, approxRows, totalBytes]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
        bound:
          type: string
          description: |
            As PostgreSQL renders it, for instance
            "FOR VALUES FROM ('2026-09-01') TO ('2026-10-01')" or "DEFAULT".
        isDefault:
          type: boolean
        partitioned:
          type: boolean
          description: The partition is partitioned in turn.
        approxRows:
          type: number
          format: double
          nullable: true
          description: The planner's estimate, null when never analysed.
        totalBytes:
          type: integer
          format: int64

    PartitionWarning:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [default_has_rows, range_ends_soon]
        message:
          type: string
        subject:
          type: string
          description: The partition the warning is about.

    ColumnRef:
      type: object
      required: [name, type, nullable, denied]
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
          description: Rendered for display, for instance "character varying(64)" or "numeric(18,4)".
          example: decimal(18,4)
        nullable:
          type: boolean
        denied:
          type: boolean
          description: The caller may not read this column. Selecting it will be refused.

    ObjectType:
      type: string
      description: |
        The five types the predecessor's Database Objects menu offers. The allowlist is
        closed: an unrecognised value is refused rather than passed through.
      enum: [view, stored_procedure, user_defined_type, function, index]

    ObjectRef:
      type: object
      required: [schema, name]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string

    ObjectDefinition:
      type: object
      required: [type, schema, name, definition, grants]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/ObjectType"
        schema:
          type: string
        name:
          type: string
        definition:
          type: string
          description: |
            The script. For a table type this is a generated CREATE TYPE, for a
            table it is the CREATE INDEX statements of every index it carries.
        grants:
          type: array
          description: |
            The permissions on the object, one statement each, public and guest
            excluded. Kept separate from the definition rather than concatenated
            onto it the way the predecessor does, so a reader can tell the object's own
            text from what was granted on it.
          items:
            type: string

    TableStructure:
      type: object
      required: [schema, name, kind, owner, columns, indexes, grants]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [table, view, partitioned]
        owner:
          type: string
          description: |
            Who may ALTER the table, which the grant list does not say and
            cannot.
        comment:
          type: string
          nullable: true
          description: What the table is for, when somebody wrote it down.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/TableColumn"
        indexes:
          type: array
          description: |
            The statements that recreate every index the table carries. Empty
            for a view, and for a table nobody has indexed.
          items:
            type: string
        grants:
          type: array
          description: |
            Who may use it, excluding PUBLIC and the owner — both defaults
            rather than decisions somebody made.
          items:
            type: string

    TableColumn:
      type: object
      required: [name, type, nullable]
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
          description: |
            Rendered the way the query console renders it, so a column reads
            the same in both places.
        nullable:
          type: boolean
        default:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true

    SelectTemplateRequest:
      type: object
      required: [instanceId, database, schema, table, columns]
      additionalProperties: false
      properties:
        instanceId:
          type: string
          format: uuid
        database:
          type: string
          minLength: 1
          maxLength: 128
        schema:
          type: string
          minLength: 1
          maxLength: 128
        table:
          type: string
          minLength: 1
          maxLength: 128
        columns:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            type: string
            minLength: 1
            maxLength: 128
        top:
          type: integer
          minimum: 1
          maximum: 100000
          default: 100
        orderBy:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            A column to sort by. Checked against the caller's column
            permissions like any other reference, because ORDER BY reads the
            column: somebody who may not select an identity number must not be
            able to sort by it either, or they can recover it a comparison at a
            time.
        descending:
          type: boolean
          default: false

    SelectTemplate:
      type: object
      required: [statement]
      additionalProperties: false
      properties:
        statement:
          type: string

    TokenCreation:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What the token is for — "laptop agent", "nightly report" — so a list of them can be read.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 730
          default: 7
          description: |
            Seven is the predecessor's figure and the default. Two years (730 days) is the ceiling
            because a token that lasts longer is one nobody remembers issuing.

    ServiceAccountCreation:
      type: object
      required: [name, description]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 63
          description: "`svc-` and then what the agent is: `svc-reporter`, `svc-daily-report`."
        description:
          type: string
          maxLength: 500
          description: What the agent is for and who runs it, for whoever reads the account a year from now.

    ServiceAccount:
      type: object
      required: [id, username, description, disabled, createdBy, createdAt, roles, tokens]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        description:
          type: string
        disabled:
          type: boolean
        createdBy:
          type: string
          description: The administrator who created it. A record, not an owner.
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
        tokens:
          type: array
          description: Every token it has held, newest first. Never a value.
          items:
            $ref: "#/components/schemas/ApiToken"

    ApiToken:
      type: object
      required: [id, name, createdAt, expiresAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When it was last presented. Null means never.
        revokedAt:
          type: string
          format: date-time
          nullable: true

    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The value, shown once. Avior holds a hash and cannot show it again.

    Session:
      type: object
      required: [user, expiresAt]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        expiresAt:
          type: string
          format: date-time

    CurrentUser:
      type: object
      required: [id, username, roles, permissions, features, environment, selfApproval, instance]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [administrator, dba, developer, release_approver, update_approver]
        permissions:
          type: array
          items:
            type: string
        features:
          type: array
          description: |
            What this deployment has switched on, as distinct from what this
            operator may do.

            A deployment that has brought no database under the write or the
            release path names no credential for it, and every endpoint there
            answers saying so. Without this the menu could not tell, and offered
            five entries whose only content was a red line explaining that they
            were switched off — which is the menu lying about what it opens, the
            thing the permission gate beside it already exists to prevent.
          items:
            type: string
            enum: [write, release, provision]
        environment:
          type: string
          description: |
            Which deployment this is, so the console can say so.

            The query console's banner named production unconditionally, because
            the sentence was written into the template rather than answered from
            anywhere. On staging that is a banner stating something untrue, and
            an amber warning that is untrue on every deployment but one is a
            warning operators learn to read past — including on the deployment
            where it is true.

            It is the deployment's own answer rather than a build-time constant
            so that one frontend bundle is promotable across environments: a
            bundle baked with its environment is a different artefact per
            environment, and the one tested is then never the one that ships.
          enum: [development, test, staging, production]
        selfApproval:
          type: boolean
          description: |
            Whether a write request may be decided by whoever wrote it.

            False everywhere that matters, and true on a deployment rehearsing
            the approval path with one operator. The page reads this rather than
            assuming, because the control it decides is one it draws or withholds
            — and a control certain to be refused after the click is worse than
            none, while a control withheld on a deployment that would have
            accepted it leaves the path unrehearsable through the interface that
            is meant to rehearse it.

            The permission is separate and unaffected: the author still holds
            write.approve or decides nothing.
        instance:
          $ref: "#/components/schemas/GovernedInstance"

    GovernedInstance:
      type: object
      required: [id, name]
      additionalProperties: false
      description: |
        The governed server this deployment reaches, as the deployment itself
        registered it from `AVIOR_TARGET_DSN`.

        The console named it `local-postgres` on every deployment, because both
        the id it sends and the name it displayed were constants in the view. The
        id being a constant was merely duplicated -- the backend derives the same
        one -- but the name was wrong everywhere except the local stack it was
        copied from.

        FEAT-012 turns this into a chosen instance among several. Until then the
        deployment reaches exactly one, and saying which one is its answer to
        give rather than the bundle's to assume.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            The host from the target DSN, which is what `RegisterInstance`
            writes to `db_instance.name` and therefore what the audit trail
            names.

    WriteRequestState:
      type: string
      description: |
        There is no resting `approved`. Approving runs the statement in the same
        operation, so a request is waiting, refused, withdrawn, or it ran.
      enum: [pending, rejected, withdrawn, applied, failed]

    WriteKind:
      type: string
      enum: [insert, update, delete]

    WriteSubmission:
      type: object
      required: [database, statement, reason]
      additionalProperties: false
      properties:
        database:
          type: string
          minLength: 1
          maxLength: 128
        statement:
          type: string
          minLength: 1
          maxLength: 65536
        reason:
          type: string
          minLength: 1
          maxLength: 2000

    WriteDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 2000

    WriteRefusal:
      type: object
      required: [code, message, reasons]
      additionalProperties: false
      description: |
        Three refusals share this shape. `guard.refused` carries the rules that
        fired; the other two are about the request or the deployment rather
        than the statement, and carry no rule because none fired.
      properties:
        code:
          type: string
          enum:
            - guard.refused
            - write.reason_missing
            - write.not_configured
            # The deployment can reach the database but nobody brought it under
            # the write path, so the capture table it would keep the old rows in
            # is not there. Distinct from write.not_configured, which is the
            # whole feature being off: here the feature works and this one
            # database is not ready.
            - write.database_not_prepared
            # The governed server refused to compile or to plan the statement.
            # A name that does not exist, or a quoted string somebody wrote with
            # double quotes and PostgreSQL read as a column. The message is the
            # server's own sentence, which is the only version worth showing.
            - write.statement_invalid
            # The governed server refused the write itself: a grant on the
            # database rather than a denial in Avior's policy. One is fixed by
            # whoever owns the database and the other by whoever wrote the
            # statement, and answering both the same way sends people to the
            # wrong person.
            - write.target_refused
        message:
          type: string
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/GuardReason"

    WriteTemplateRequest:
      type: object
      required: [kind, schema, table]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/WriteKind"
        schema:
          type: string
          minLength: 1
          maxLength: 128
        table:
          type: string
          minLength: 1
          maxLength: 128
        columns:
          type: array
          maxItems: 1024
          description: |
            Required for an update and an insert, and ignored for a delete,
            which removes whole rows and names no column.
          items:
            type: string
            minLength: 1
            maxLength: 128

    WriteTemplate:
      type: object
      required: [statement]
      additionalProperties: false
      properties:
        statement:
          type: string

    WriteInspection:
      type: object
      required: [database, statement]
      additionalProperties: false
      properties:
        database:
          type: string
          minLength: 1
          maxLength: 128
        statement:
          type: string
          minLength: 1
          maxLength: 65536

    WriteVerdict:
      type: object
      required: [decision, reasons]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/GuardReason"
        kind:
          $ref: "#/components/schemas/WriteKind"
        targetTable:
          type: string
          description: Schema-qualified, as the execution plan resolved it.
        estimatedRows:
          type: integer
          format: int64
        backup:
          $ref: "#/components/schemas/WriteBackupPlan"

    WriteBackupPlan:
      type: object
      required: [table, direction, rows, reverseStatement]
      additionalProperties: false
      description: |
        What the write would keep, before it has kept it. Present only when the
        guard allowed the statement: there is nothing to describe about a write
        that will not run.
      properties:
        table:
          type: string
          description: Where the rows land, in the database being changed.
        direction:
          type: string
          enum: [before, after]
          description: |
            `before` for a write that overwrites or removes rows, `after` for one
            that adds them. It is what the reverse statement reads.
        rows:
          type: integer
          format: int64
        reverseStatement:
          type: string
          description: |
            The statement that would put them back, generated against the table
            as it is now. Keyed by the nil UUID, because the request it belongs
            to does not exist yet — the zeros are where its own id goes.

    WriteRequest:
      type: object
      required:
        [id, database, statement, kind, targetTable, reason, requestedBy,
         requestedAt, estimatedRows, state, reversible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        database:
          type: string
        statement:
          type: string
        kind:
          $ref: "#/components/schemas/WriteKind"
        targetTable:
          type: string
          description: Schema-qualified, as the execution plan resolved it.
        reason:
          type: string
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        estimatedRows:
          type: integer
          format: int64
          description: |
            What the optimiser said before anybody approved it. Kept beside
            affectedRows on purpose: an estimate of ten and an outcome of nine
            hundred is the thing somebody wants to find later.
        state:
          $ref: "#/components/schemas/WriteRequestState"
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        decisionNote:
          type: string
        ranAt:
          type: string
          format: date-time
        affectedRows:
          type: integer
          format: int64
        durationMs:
          type: integer
        error:
          type: string
        captureRows:
          type: integer
          format: int64
        reverseStatement:
          type: string
          description: |
            The statement that puts the table back. Generated and kept, never
            run by Avior: undoing a write is another change to production and
            goes through the same door.
        captureRemovedAt:
          type: string
          format: date-time
        captureRemovedBy:
          type: string
        reversible:
          type: boolean
          description: Whether the rows needed to undo this are still there.
        rollbackOf:
          type: string
          format: uuid
          description: |
            The request this one undoes. Present only on a rollback, which is an
            ordinary write request with an ordinary backup of its own.
        rolledBackBy:
          type: string
          format: uuid
          description: The rollback that undid this request, once one has run.

    WriteRollback:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000

    WriteRequestDetail:
      type: object
      required: [request, history]
      additionalProperties: false
      properties:
        request:
          $ref: "#/components/schemas/WriteRequest"
        history:
          type: array
          items:
            $ref: "#/components/schemas/WriteRequestChange"

    WriteRequestChange:
      type: object
      required: [action, changedAt]
      additionalProperties: false
      properties:
        actor:
          type: string
          description: Empty when nobody did it, which is a deployment running without approval.
        action:
          type: string
          enum: [submit, approve, reject, withdraw, run, fail, capture_removed]
        note:
          type: string
        changedAt:
          type: string
          format: date-time

    WriteCapture:
      type: object
      required: [request, ageHours, stale]
      additionalProperties: false
      properties:
        request:
          $ref: "#/components/schemas/WriteRequest"
        ageHours:
          type: integer
        stale:
          type: boolean
          description: |
            Older than seven days. A mark, not a deadline: nothing happens to a
            capture because of its age.

    QueryRequest:
      type: object
      required: [instanceId, database, statement]
      additionalProperties: false
      properties:
        instanceId:
          type: string
          format: uuid
        database:
          type: string
          minLength: 1
          maxLength: 128
        statement:
          type: string
          minLength: 1
          maxLength: 65536
        maxRows:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30

    GuardVerdict:
      type: object
      required: [decision, reasons, referencedTables, referencedColumns, limits]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reasons:
          type: array
          description: Empty when decision is allow. Never empty when deny.
          items:
            $ref: "#/components/schemas/GuardReason"
        referencedTables:
          type: array
          items:
            type: string
        referencedColumns:
          type: array
          items:
            type: string
        estimatedCost:
          type: number
          format: double
          nullable: true
        estimatedRows:
          type: number
          format: double
          nullable: true
        limits:
          $ref: "#/components/schemas/GuardLimits"
        partitionScans:
          type: array
          description: |
            FEAT-075. Set on an inspect whose plan reads a partition: one entry
            per partitioned table, with the partitions the plan scans out of
            all it has. What pruning left is what an operator reads to tell a
            statement that touches one month from one that touches every one.
          items:
            $ref: "#/components/schemas/PartitionScan"

    PartitionScan:
      type: object
      required: [schema, name, total, scanned]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
          description: The partitioned table at the root of the scanned partitions.
        total:
          type: integer
          description: Its leaf partitions.
        scanned:
          type: array
          items:
            $ref: "#/components/schemas/ScannedPartition"

    ScannedPartition:
      type: object
      required: [schema, name, estimatedRows]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
        estimatedRows:
          type: number
          format: double
          description: The plan's estimate for the node that reads it.

    GuardLimits:
      type: object
      description: |
        FEAT-068. The caps the guard applied to this statement. Returned on
        every verdict and result, whether or not a plan was made. A null cap is
        one this deployment does not apply.
      required: [maxCost, maxRows]
      additionalProperties: false
      properties:
        maxCost:
          type: number
          format: double
          nullable: true
        maxRows:
          type: number
          format: double
          nullable: true

    GuardReason:
      type: object
      required: [rule, message]
      additionalProperties: false
      properties:
          rule:
            type: string
            enum:
              - parse_failed
              - statement_not_read_only
              - wildcard_select
              - column_denied
              - table_denied
              - cost_limit_exceeded
              - row_limit_exceeded
              - unsupported_syntax
              - opaque_function
              - database_denied
              - statement_not_single_write
              - unsupported_write_syntax
              - missing_where_clause
              - multiple_tables
              - irreversible_write
              - server_version_unsupported
              - rate_limited
          message:
            type: string
          subject:
            type: string
            description: The table, column, or token the rule fired on.

    QueryResult:
      type: object
      required: [columns, rows, rowCount, truncated, elapsedMs, auditId, limits]
      additionalProperties: false
      properties:
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            additionalProperties: false
            properties:
              name:
                type: string
              type:
                type: string
              masked:
                type: boolean
                default: false
        rows:
          type: array
          items:
            type: array
            items:
              nullable: true
        rowCount:
          type: integer
        truncated:
          type: boolean
        elapsedMs:
          type: integer
        auditId:
          type: string
          format: uuid
        estimatedCost:
          type: number
          format: double
          nullable: true
          description: The guard's estimate for this statement, as inspect reports it.
        estimatedRows:
          type: number
          format: double
          nullable: true
        limits:
          $ref: "#/components/schemas/GuardLimits"

    SearchResult:
      type: object
      required: [hits, limit, indexing]
      additionalProperties: false
      properties:
        hits:
          type: array
          description: Ranked, best first.
          items:
            $ref: "#/components/schemas/SearchHit"
        limit:
          type: integer
          description: The total cap actually applied.
        indexing:
          type: integer
          description: |
            Reachable databases whose table snapshot is still being built, and
            which therefore contributed no table hits.

    SearchHit:
      type: object
      required: [kind, label]
      additionalProperties: false
      description: |
        `database` is set on every kind but `operator`. `schema`, `name` and
        `objectKind` are set on a table. `id` is set on a write request, a
        release and an operator.
      properties:
        kind:
          type: string
          enum: [database, table, write_request, release, operator]
        label:
          type: string
          description: The text that matched.
        id:
          type: string
          format: uuid
        database:
          type: string
        schema:
          type: string
        name:
          type: string
        objectKind:
          type: string
          enum: [table, view, partitioned]
        serviceAccount:
          type: boolean
          description: Set on an operator; true for a service account.
        state:
          type: string
          description: A write request's or a release's state.

    SchemaGraph:
      type: object
      required: [nodes, edges, total, truncated]
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SchemaEdge"
        total:
          type: object
          description: Counts before the server's cap.
          required: [nodes, edges]
          additionalProperties: false
          properties:
            nodes:
              type: integer
            edges:
              type: integer
        truncated:
          type: boolean

    SchemaNode:
      type: object
      required: [schema, name, kind, columns, approxRows]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [table, view]
        columns:
          type: integer
        approxRows:
          type: number
          format: double
          nullable: true
          description: The planner's estimate, null when never analysed.

    SchemaNodeRef:
      type: object
      required: [schema, name]
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string

    SchemaEdge:
      type: object
      required: [from, to, kind]
      additionalProperties: false
      properties:
        from:
          $ref: "#/components/schemas/SchemaNodeRef"
        to:
          $ref: "#/components/schemas/SchemaNodeRef"
        kind:
          type: string
          enum: [foreign_key, view_dependency]

    LineageState:
      type: string
      enum: [ready, building]
      description: |
        `building` while the database's first snapshot is still being built.
        Such an answer carries no graph and means nothing about the database's
        relationships; ask again.

    LineageSnapshot:
      type: object
      required: [builtAt, stale, parsed, reused, unparsed, dynamic, opaque]
      additionalProperties: false
      properties:
        builtAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: Older than the freshness window, and being rebuilt.
        parsed:
          type: integer
          description: Routines parsed by the build that made this snapshot.
        reused:
          type: integer
          description: Routines whose definition had not changed, taken from the parse cache.
        unparsed:
          type: integer
          description: Routines whose body the parser rejected.
        dynamic:
          type: integer
          description: Routines that build SQL at run time.
        opaque:
          type: integer
          description: Routines in a language other than SQL and PL/pgSQL.

    LineageFocusKind:
      type: string
      enum: [table, view, matview, sequence, routine]
      description: What an object given by name is. A routine is a function or a procedure.

    LineageNodeKind:
      type: string
      enum: [table, view, matview, function, procedure, sequence]

    LineageEdgeKind:
      type: string
      enum: [foreign_key, view_read, trigger, policy_read, default, routine_read, routine_write, call, inheritance]

    LineageAccess:
      type: string
      enum: [read, write, reference]

    LineageConfidence:
      type: string
      enum: [exact, parsed]

    LineageBadge:
      type: string
      enum: [search_path_assumed, overload_ambiguous, view_unmapped, ambiguous, dynamic, may_reach_unknown, unparsed, opaque]

    LineageParseStatus:
      type: string
      enum: [parsed, unparsed, opaque]

    LineageNode:
      type: object
      required: [id, kind, schema, name]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque, and stable while the object's identity holds.
        kind:
          $ref: "#/components/schemas/LineageNodeKind"
        schema:
          type: string
        name:
          type: string
        arguments:
          type: string
          description: A routine's identity arguments.
        hop:
          type: integer
          description: Hops from the focus, in a neighbourhood.
        extension:
          type: boolean
          description: An extension owns this routine.
        hidden:
          type: integer
          description: Set on a collapsed hub, the neighbours it hides.
        badges:
          type: array
          items:
            $ref: "#/components/schemas/LineageBadge"

    LineageColumnName:
      type: object
      required: [name, restricted]
      additionalProperties: false
      properties:
        name:
          type: string
        restricted:
          type: boolean
          description: A FEAT-055 restriction covers this column for the caller.

    LineageEdge:
      type: object
      required: [from, to, kind, access, confidence]
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
        kind:
          $ref: "#/components/schemas/LineageEdgeKind"
        access:
          $ref: "#/components/schemas/LineageAccess"
        confidence:
          $ref: "#/components/schemas/LineageConfidence"
        fromColumns:
          type: array
          description: |
            The columns on the `from` side: a foreign key's referencing columns,
            paired by position with `toColumns`; a default's column; a trigger's
            `UPDATE OF` columns.
          items:
            $ref: "#/components/schemas/LineageColumnName"
        toColumns:
          type: array
          description: The columns on the `to` side the edge reads, writes or references.
          items:
            $ref: "#/components/schemas/LineageColumnName"
        events:
          type: array
          description: A trigger's events.
          items:
            $ref: "#/components/schemas/LineageTriggerEvent"
        evidence:
          $ref: "#/components/schemas/LineageEvidence"

    LineageEvidence:
      type: object
      description: |
        What a route's hop rests on, set on a path's edges only: a view's
        definition, a routine's statement and its line, or the trigger,
        policy or column that joins the two. A foreign key's evidence is its
        column pairs, already on the edge.
      additionalProperties: false
      properties:
        excerpt:
          type: string
          maxLength: 120
        line:
          type: integer
        via:
          type: string

    LineageTotal:
      type: object
      description: Counts before the cap, after the filters.
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          type: integer
        edges:
          type: integer

    LineageGraph:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/LineageState"
        snapshot:
          $ref: "#/components/schemas/LineageSnapshot"
        focus:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/LineageNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/LineageEdge"
        total:
          $ref: "#/components/schemas/LineageTotal"
        truncated:
          type: boolean
        extensionsHidden:
          type: integer
          description: Extension-owned routines left out because `extensions` was not set.
        dynamic:
          type: array
          maxItems: 50
          description: |
            The database's routines that build SQL at run time, in or out of
            this neighbourhood, at most 50 in schema and name order;
            `snapshot.dynamic` counts them all. What their built SQL touches
            cannot be known, so none of it is an edge.
          items:
            $ref: "#/components/schemas/LineageNode"

    LineageRoute:
      type: object
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          type: array
          description: The route's node ids, from the first object to the second.
          items:
            type: string
        edges:
          type: array
          items:
            $ref: "#/components/schemas/LineageEdge"

    LineagePath:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/LineageState"
        snapshot:
          $ref: "#/components/schemas/LineageSnapshot"
        nodes:
          type: array
          description: Every node any route passes through.
          items:
            $ref: "#/components/schemas/LineageNode"
        routes:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/LineageRoute"

    LineageSchemaCluster:
      type: object
      required: [schema, objects, tables, views, routines, anchor]
      additionalProperties: false
      properties:
        schema:
          type: string
        objects:
          type: integer
        tables:
          type: integer
        views:
          type: integer
          description: Views and materialised views.
        routines:
          type: integer
          description: Functions and procedures.
        anchor:
          $ref: "#/components/schemas/LineageNode"

    LineageSchemaLink:
      type: object
      required: [from, to, edges, reads, writes]
      additionalProperties: false
      description: Every edge between two schemas, whichever way it points.
      properties:
        from:
          type: string
        to:
          type: string
        edges:
          type: integer
        reads:
          type: integer
        writes:
          type: integer

    LineageOverview:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/LineageState"
        snapshot:
          $ref: "#/components/schemas/LineageSnapshot"
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/LineageSchemaCluster"
        links:
          type: array
          items:
            $ref: "#/components/schemas/LineageSchemaLink"

    LineageUsageConfidence:
      type: string
      enum: [exact, parsed, dynamic]

    LineageColumnEntry:
      type: object
      required: [object, access, confidence, kind]
      additionalProperties: false
      properties:
        object:
          $ref: "#/components/schemas/LineageNode"
        access:
          type: string
          enum: [read, write]
        confidence:
          $ref: "#/components/schemas/LineageUsageConfidence"
        kind:
          $ref: "#/components/schemas/LineageEdgeKind"
        excerpt:
          type: string
          maxLength: 120
        line:
          type: integer
        via:
          type: string
          description: |
            Why the object reads or writes the column, when the object alone
            does not say: `policy <name>`, `generated column <name>`, `default
            of <name>` or `cascading foreign key`. A table reading its own
            column does so through one of these.

    LineageColumnCount:
      type: object
      required: [column, reads, writes, foreignKey]
      additionalProperties: false
      properties:
        column:
          $ref: "#/components/schemas/LineageColumnName"
        reads:
          type: integer
        writes:
          type: integer
        foreignKey:
          type: boolean
          description: A foreign key uses this column, on either side.

    LineageImpactSummary:
      type: object
      required: [writers, readers, views, triggers, dynamic]
      additionalProperties: false
      description: |
        Distinct objects over every entry, not only the page. A routine that
        builds SQL at run time counts once, as `dynamic`.
      properties:
        writers:
          type: integer
        readers:
          type: integer
        views:
          type: integer
        triggers:
          type: integer
        dynamic:
          type: integer

    LineageImpactTrigger:
      type: object
      required: [name, function, events]
      additionalProperties: false
      properties:
        name:
          type: string
        function:
          $ref: "#/components/schemas/LineageNode"
        events:
          type: array
          items:
            $ref: "#/components/schemas/LineageTriggerEvent"

    LineageTriggerEvent:
      type: string
      enum: [insert, update, delete, truncate]

    LineageHop:
      type: object
      required: [kind, node]
      additionalProperties: false
      description: |
        One link of an indirect entry's chain: a view read through, a trigger
        on a table (`trigger` names it), or the routine that trigger runs.
      properties:
        kind:
          $ref: "#/components/schemas/LineageEdgeKind"
        node:
          $ref: "#/components/schemas/LineageNode"
        trigger:
          type: string

    LineageIndirectEntry:
      type: object
      required: [entry, via]
      additionalProperties: false
      properties:
        entry:
          $ref: "#/components/schemas/LineageColumnEntry"
        via:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineageHop"

    LineageColumn:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/LineageState"
        snapshot:
          $ref: "#/components/schemas/LineageSnapshot"
        table:
          $ref: "#/components/schemas/LineageNode"
        column:
          $ref: "#/components/schemas/LineageColumnName"
        entries:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/LineageColumnEntry"
        counts:
          type: array
          items:
            $ref: "#/components/schemas/LineageColumnCount"
        summary:
          $ref: "#/components/schemas/LineageImpactSummary"
        triggers:
          type: array
          description: The first page's triggers that fire for the column or table.
          items:
            $ref: "#/components/schemas/LineageImpactTrigger"
        indirect:
          type: array
          maxItems: 20
          description: The first page's indirect reach, at most 20.
          items:
            $ref: "#/components/schemas/LineageIndirectEntry"
        indirectTotal:
          type: integer
          description: How many indirect entries there are, capped or not.
        next:
          type: string
          description: The cursor for the next page, absent on the last.

    LineageTableColumns:
      type: object
      required: [table, columns, confidence]
      additionalProperties: false
      properties:
        table:
          $ref: "#/components/schemas/LineageNode"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/LineageColumnName"
        confidence:
          $ref: "#/components/schemas/LineageConfidence"

    LineageStatement:
      type: object
      required: [line, excerpt]
      additionalProperties: false
      properties:
        line:
          type: integer
        excerpt:
          type: string
          maxLength: 120

    LineageSite:
      type: object
      required: [line, form]
      additionalProperties: false
      properties:
        line:
          type: integer
        form:
          type: string
          description: The construct found there, such as `EXECUTE` or `MERGE`.
        excerpt:
          type: string
          maxLength: 120

    LineageFiredTrigger:
      type: object
      required: [name, table, function]
      additionalProperties: false
      properties:
        name:
          type: string
        table:
          $ref: "#/components/schemas/LineageNode"
        function:
          $ref: "#/components/schemas/LineageNode"

    LineageRoutine:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/LineageState"
        snapshot:
          $ref: "#/components/schemas/LineageSnapshot"
        routine:
          $ref: "#/components/schemas/LineageNode"
        status:
          $ref: "#/components/schemas/LineageParseStatus"
        message:
          type: string
          description: The parser's message, when the body is unparsed.
        reads:
          type: array
          items:
            $ref: "#/components/schemas/LineageTableColumns"
        writes:
          type: array
          items:
            $ref: "#/components/schemas/LineageTableColumns"
        statements:
          type: array
          items:
            $ref: "#/components/schemas/LineageStatement"
        calls:
          type: array
          items:
            $ref: "#/components/schemas/LineageNode"
        transitiveCalls:
          type: array
          items:
            $ref: "#/components/schemas/LineageNode"
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/LineageFiredTrigger"
        dynamic:
          type: array
          items:
            $ref: "#/components/schemas/LineageSite"
        unmodelled:
          type: array
          items:
            $ref: "#/components/schemas/LineageSite"
        unresolved:
          type: array
          description: Names the routine uses that resolve to no permanent object, such as a temporary table.
          items:
            type: string
        mayReachUnknown:
          type: boolean
          description: It calls, directly or transitively, a routine that builds SQL at run time.

    AuditHistogram:
      type: object
      required: [from, to, bucketSeconds, buckets]
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
          description: The window's start, as applied.
        to:
          type: string
          format: date-time
          description: The window's exclusive end, as applied.
        bucketSeconds:
          type: integer
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/AuditBucket"

    AuditBucket:
      type: object
      required: [start, allowed, denied]
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        allowed:
          type: integer
        denied:
          type: integer

    ObservatoryUsage:
      type: object
      required: [from, to, rows]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryUsageRow"

    ObservatoryUsageRow:
      type: object
      required: [operatorId, operator, database, statements, allowed, refused, refusals, executed, elapsedP50Ms, elapsedP95Ms, rowsTotal]
      additionalProperties: false
      properties:
        operatorId: { type: string, format: uuid }
        operator: { type: string }
        database: { type: string }
        statements: { type: integer }
        allowed: { type: integer }
        refused: { type: integer }
        refusals:
          type: array
          description: Refused statements counted by reason code, most frequent first.
          items:
            type: object
            required: [reason, count]
            additionalProperties: false
            properties:
              reason: { type: string }
              count: { type: integer }
        executed:
          type: integer
          description: How many statements the elapsed and rows figures are over.
        elapsedP50Ms: { type: integer, nullable: true }
        elapsedP95Ms: { type: integer, nullable: true }
        rowsTotal: { type: integer, format: int64 }

    ObservatoryDatabases:
      type: object
      required: [idleDays, lastRunAt, flagsWithheld, databases]
      additionalProperties: false
      properties:
        idleDays: { type: integer }
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          description: When the last snapshot run finished; null before the first.
        flagsWithheld:
          type: string
          nullable: true
          description: Why no object is flagged on this instance, when a connected standby is not read.
        databases:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryDatabase"

    ObservatoryDatabase:
      type: object
      required: [database, sizeBytes, sizeBytes7d, sizeBytes30d, growth, routinesTrackedSince, relationsTrackedSince, flagged, lastResetAt]
      additionalProperties: false
      properties:
        database: { type: string }
        sizeBytes: { type: integer, format: int64, nullable: true }
        sizeBytes7d: { type: integer, format: int64, nullable: true }
        sizeBytes30d: { type: integer, format: int64, nullable: true }
        growth:
          type: array
          description: One point per UTC day with a snapshot, oldest first, at most 400.
          items:
            $ref: "#/components/schemas/ObservatorySizePoint"
        routinesTrackedSince: { type: string, format: date-time, nullable: true }
        relationsTrackedSince: { type: string, format: date-time, nullable: true }
        flagged: { type: integer }
        lastResetAt: { type: string, format: date-time, nullable: true }

    ObservatorySizePoint:
      type: object
      required: [day, sizeBytes]
      additionalProperties: false
      properties:
        day: { type: string, format: date }
        sizeBytes: { type: integer, format: int64 }

    ObservatoryObjects:
      type: object
      required: [database, idleDays, routinesTrackedSince, relationsTrackedSince, flagsWithheld, objects, routineGroups]
      additionalProperties: false
      properties:
        database: { type: string }
        idleDays: { type: integer }
        routinesTrackedSince: { type: string, format: date-time, nullable: true }
        relationsTrackedSince: { type: string, format: date-time, nullable: true }
        flagsWithheld: { type: string, nullable: true }
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryObject"
        routineGroups:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryRoutineGroup"

    ObservatoryObject:
      type: object
      required: [schema, name, kind, signature, table, tracked, notTrackedReason, lastUsedAt, lastUsedKind, lastUsedNode, daysAgo, flagged, constraintBacked, sizeBytes, growth30dBytes, calls]
      additionalProperties: false
      properties:
        schema: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [table, index, function, procedure]
        signature:
          type: string
          nullable: true
          description: A routine's argument types, which tell overloads apart.
        table:
          type: string
          nullable: true
          description: The table an index belongs to.
        tracked: { type: boolean }
        notTrackedReason: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        lastUsedKind:
          type: string
          nullable: true
          enum: [run, read, written, scanned]
        lastUsedNode:
          type: string
          nullable: true
          description: The node the latest use was seen on, primary or a declared standby.
        daysAgo: { type: integer, nullable: true }
        flagged: { type: boolean }
        constraintBacked:
          type: boolean
          description: An index that enforces a primary key, unique or exclusion constraint. Never flagged.
        sizeBytes: { type: integer, format: int64, nullable: true }
        growth30dBytes: { type: integer, format: int64, nullable: true }
        calls: { type: integer, format: int64, nullable: true }

    ObservatoryRoutineGroup:
      type: object
      required: [schema, base, latest, flaggedCount, lastUsedAt, versions]
      additionalProperties: false
      properties:
        schema: { type: string }
        base: { type: string }
        latest:
          type: string
          description: The name of the version with the latest date.
        flaggedCount: { type: integer }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        versions:
          type: array
          description: Newest date first.
          items:
            $ref: "#/components/schemas/ObservatoryRoutineVersion"

    ObservatoryRoutineVersion:
      type: object
      required: [name, signature, date, latest, lastUsedAt, daysAgo, flagged]
      additionalProperties: false
      properties:
        name: { type: string }
        signature: { type: string }
        date: { type: string, format: date }
        latest: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        daysAgo: { type: integer, nullable: true }
        flagged: { type: boolean }

    ObservatoryHealth:
      type: object
      required: [database, tables]
      additionalProperties: false
      properties:
        database: { type: string }
        tables:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryTableHealth"

    ObservatoryTableHealth:
      type: object
      required: [schema, name, sizeBytes, liveTuples, deadTuples, deadRatio, seqScans, seqRowsRead, idxScans, lastAutovacuum, lastAutoanalyze]
      additionalProperties: false
      properties:
        schema: { type: string }
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        liveTuples: { type: integer, format: int64 }
        deadTuples: { type: integer, format: int64 }
        deadRatio:
          type: number
          description: Dead over live plus dead, 0 when both are 0.
        seqScans: { type: integer, format: int64 }
        seqRowsRead: { type: integer, format: int64 }
        idxScans: { type: integer, format: int64 }
        lastAutovacuum: { type: string, format: date-time, nullable: true }
        lastAutoanalyze: { type: string, format: date-time, nullable: true }

    ObservatoryStatements:
      type: object
      required: [statsSince, statements]
      additionalProperties: false
      properties:
        statsSince:
          type: string
          format: date-time
          nullable: true
          description: pg_stat_statements_info.stats_reset; the numbers are cumulative since.
        statements:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryStatement"

    ObservatoryStatement:
      type: object
      required: [queryId, database, role, calls, totalMs, meanMs, rows, text]
      additionalProperties: false
      properties:
        queryId:
          type: string
          description: pg_stat_statements' queryid, as a string so every digit survives.
        database: { type: string }
        role: { type: string }
        calls: { type: integer, format: int64 }
        totalMs: { type: number }
        meanMs: { type: number }
        rows: { type: integer, format: int64 }
        text: { type: string }

    ObservatoryActivity:
      type: object
      required: [generatedAt, backends]
      additionalProperties: false
      properties:
        generatedAt: { type: string, format: date-time }
        backends:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryBackend"

    ObservatoryBackend:
      type: object
      required: [pid, database, role, state, startedAt, runningForMs, waitEvent, text]
      additionalProperties: false
      properties:
        pid: { type: integer }
        database: { type: string }
        role: { type: string }
        state: { type: string }
        startedAt: { type: string, format: date-time }
        runningForMs: { type: integer, format: int64 }
        waitEvent: { type: string, nullable: true }
        text: { type: string }

    ObservatoryUsageSeries:
      type: object
      required: [from, to, bucketSeconds, buckets, totals, previous]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucketSeconds:
          type: integer
          description: 3600, 21600 or 86400.
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryUsageBucket"
        totals:
          $ref: "#/components/schemas/ObservatoryUsageTotals"
        previous:
          $ref: "#/components/schemas/ObservatoryUsageTotals"

    ObservatoryUsageBucket:
      type: object
      required: [start, allowed, refused, p50Ms, p95Ms]
      additionalProperties: false
      properties:
        start: { type: string, format: date-time }
        allowed: { type: integer }
        refused: { type: integer }
        p50Ms: { type: integer, nullable: true }
        p95Ms: { type: integer, nullable: true }

    ObservatoryUsageTotals:
      type: object
      required: [statements, allowed, refused, executed, p50Ms, p95Ms]
      additionalProperties: false
      properties:
        statements: { type: integer }
        allowed: { type: integer }
        refused: { type: integer }
        executed: { type: integer }
        p50Ms: { type: integer, nullable: true }
        p95Ms: { type: integer, nullable: true }

    ObservatorySummary:
      type: object
      required: [idleDays, flagsWithheld, largestTables, idle]
      additionalProperties: false
      properties:
        idleDays: { type: integer }
        flagsWithheld: { type: string, nullable: true }
        largestTables:
          type: array
          description: The ten largest tables by total size, largest first.
          items:
            type: object
            required: [database, schema, name, sizeBytes, growth30dBytes]
            additionalProperties: false
            properties:
              database: { type: string }
              schema: { type: string }
              name: { type: string }
              sizeBytes: { type: integer, format: int64 }
              growth30dBytes: { type: integer, format: int64, nullable: true }
        idle:
          type: array
          description: Flagged objects counted per database and kind; a pair with none is absent.
          items:
            type: object
            required: [database, kind, count]
            additionalProperties: false
            properties:
              database: { type: string }
              kind:
                type: string
                enum: [table, index, function, procedure]
              count: { type: integer }

    ObservatoryRoutines:
      type: object
      required: [from, to, statsSince, tracking, routines, groups]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        statsSince:
          type: string
          format: date-time
          nullable: true
          description: pg_stat_statements_info.stats_reset, which maxCallMs counts from.
        tracking:
          type: array
          description: When each reachable database's routine timing began.
          items:
            type: object
            required: [database, since]
            additionalProperties: false
            properties:
              database: { type: string }
              since: { type: string, format: date-time, nullable: true }
        routines:
          type: array
          items:
            $ref: "#/components/schemas/ObservatoryRoutine"
        groups:
          type: array
          description: Date-versioned routines by base name, newest version first.
          items:
            $ref: "#/components/schemas/ObservatoryRoutineTimingGroup"

    ObservatoryRoutine:
      type: object
      required: [database, schema, name, signature, kind, timed, notTimedReason, calls, totalMs, selfMs, meanMs, maxCallMs]
      additionalProperties: false
      properties:
        database: { type: string }
        schema: { type: string }
        name: { type: string }
        signature: { type: string }
        kind:
          type: string
          enum: [function, procedure]
        timed: { type: boolean }
        notTimedReason: { type: string, nullable: true }
        calls: { type: integer, format: int64 }
        totalMs: { type: number }
        selfMs: { type: number }
        meanMs:
          type: number
          nullable: true
          description: totalMs over calls; null when the routine was not called in the window.
        maxCallMs: { type: number, nullable: true }

    ObservatoryRoutineTimingGroup:
      type: object
      required: [database, schema, base, latest, versions]
      additionalProperties: false
      properties:
        database: { type: string }
        schema: { type: string }
        base: { type: string }
        latest: { type: string }
        versions:
          type: array
          items:
            type: object
            required: [name, signature, date]
            additionalProperties: false
            properties:
              name: { type: string }
              signature: { type: string }
              date: { type: string, format: date }

security:
  - sessionCookie: []
