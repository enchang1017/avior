# Avior from the published images, with nothing built on the host.
#
# Runs against a PostgreSQL server that already exists and has been prepared
# with deploy/store/bootstrap.sql: production governs real databases, so a
# server bundled here would be the wrong one. The development stack is the
# docker-compose.yml at the repository root, which builds from the checkout.
#
#   cd deploy/compose
#   export AVIOR_VERSION=1.2.0
#   docker compose up -d
#
# Every command against this file needs AVIOR_VERSION, ps and logs included.
# docs/runbooks/deploy-from-published-images.md is the whole procedure.

name: avior-release

services:
  # One-shot. Applies db/migrations to aviordb as its owner and exits, and the
  # gateway starts only once it has succeeded. Its secrets directory is its own,
  # so nothing of the gateway's is mounted into it.
  migrate:
    image: ghcr.io/${AVIOR_IMAGE_OWNER:-enchang1017}/avior-migrate:${AVIOR_VERSION:?set AVIOR_VERSION to a release such as 1.2.0, or latest}
    env_file: migrate.env
    environment:
      AVIOR_STORE_PASSWORD_FILE: /run/secrets/avior/store_owner_password
    volumes:
      - ./secrets/migrate:/run/secrets/avior:ro
    restart: "no"

  backend:
    image: ghcr.io/${AVIOR_IMAGE_OWNER:-enchang1017}/avior-backend:${AVIOR_VERSION:?set AVIOR_VERSION to a release such as 1.2.0, or latest}
    env_file: gateway.env
    # The binary's own default is development. Unset here means production, and
    # staging has to be asked for by name.
    environment:
      AVIOR_ENV: ${AVIOR_ENV:-production}
      AVIOR_HTTP_ADDR: ":8080"
    volumes:
      - ./secrets/gateway:/run/secrets/avior:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/${AVIOR_IMAGE_OWNER:-enchang1017}/avior-frontend:${AVIOR_VERSION:?set AVIOR_VERSION to a release such as 1.2.0, or latest}
    restart: unless-stopped

  # The console calls /api/v1 on its own origin, so something has to put both
  # behind one. This is that, and the ingress in a cluster. Plain HTTP on
  # loopback: the session cookie is Secure, so TLS terminates in front of it.
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${AVIOR_PUBLISH:-127.0.0.1:8080}:8080"
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
    # The gateway's image has no shell to probe itself with, so readiness is
    # asked through the route an operator's browser takes.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
